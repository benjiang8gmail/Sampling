<div id="root"></div>

<script type="text/app-jsx" id="app-code">
const {useState,useEffect,useMemo,useRef} = React;

// Tool version — stamped on every export and working paper so a reperformer
// knows which selection/evaluation rules produced a result.
const TOOL_VERSION = "2.1 (07/07/2026)";
const SESSION_KEY  = "mus_session_v1";

/* ============================================================
   MUS sample-size lookup tables (from VAGO DST guidance)
   rows = materiality %, cols = confidence %
   ============================================================ */
const CONF_LEVELS = [65,70,75,80,85,90,95];
const MAT_LEVELS  = [10,5,3,1];
const SAMPLE_TABLES = {
  Low: {
    65:{10:12,5:24,3:40,1:120}, 70:{10:14,5:28,3:47,1:139},
    75:{10:17,5:33,3:54,1:161}, 80:{10:19,5:38,3:63,1:189},
    85:{10:23,5:45,3:75,1:225}, 90:{10:28,5:56,3:93,1:277},
    95:{10:37,5:74,3:123,1:368},
  },
  Moderate: {
    65:{10:17,5:33,3:55,1:163}, 70:{10:20,5:39,3:65,1:193},
    75:{10:23,5:46,3:77,1:230}, 80:{10:28,5:56,3:93,1:277},
    85:{10:35,5:69,3:114,1:341}, 90:{10:44,5:87,3:145,1:433},
    95:{10:60,5:120,3:200,1:600},
  }
};

/* ============================================================
   Numerical core — Poisson reliability factors via the inverse
   regularised lower incomplete gamma function.
   RF(k, conf) = gammaPInv(k+1, conf)   (k = # overstatement errors)
   ============================================================ */
function logGamma(x){
  const c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,
    771.32342877765313,-176.61502916214059,12.507343278686905,
    -0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x))-logGamma(1-x);
  x-=1; let a=c[0]; const t=x+7.5;
  for(let i=1;i<9;i++) a+=c[i]/(x+i);
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
// regularised lower incomplete gamma P(a,x)
function gammaP(a,x){
  if(x<=0||a<=0) return 0;
  if(x<a+1){ // series
    let ap=a,sum=1/a,del=sum;
    for(let n=0;n<1000;n++){ ap+=1; del*=x/ap; sum+=del;
      if(Math.abs(del)<Math.abs(sum)*1e-15) break; }
    return sum*Math.exp(-x+a*Math.log(x)-logGamma(a));
  } else { // continued fraction for Q=1-P
    const tiny=1e-300; let b=x+1-a,c=1/tiny,d=1/b,h=d;
    for(let i=1;i<=1000;i++){ const an=-i*(i-a); b+=2;
      d=an*d+b; if(Math.abs(d)<tiny)d=tiny;
      c=b+an/c; if(Math.abs(c)<tiny)c=tiny;
      d=1/d; const del=d*c; h*=del;
      if(Math.abs(del-1)<1e-15) break; }
    return 1-Math.exp(-x+a*Math.log(x)-logGamma(a))*h;
  }
}
// inverse: find x such that gammaP(a,x)=p  (bisection — robust)
function gammaPInv(a,p){
  if(p<=0) return 0; if(p>=1) return Infinity;
  let lo=0,hi=Math.max(a*2,10);
  let guard=0;
  while(gammaP(a,hi)<p && guard++<60) hi*=2;
  for(let i=0;i<200;i++){ const mid=(lo+hi)/2;
    if(gammaP(a,mid)<p) lo=mid; else hi=mid; }
  return (lo+hi)/2;
}
// confidence as a fraction (0.95). errors k>=0.
// Round UP to 2 decimals to match published audit reliability-factor tables
// (the standard convention — conservative, never understates the bound).
function reliabilityFactor(confFrac,k){ return Math.ceil(gammaPInv(k+1,confFrac)*100 - 1e-9)/100; }

const money = (n)=> (n==null||isNaN(n)||!isFinite(n)) ? '—'
  : (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const num0 = (n)=> (n==null||isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-AU');
const pct = (n)=> (n==null||isNaN(n)) ? '—' : (n*100).toFixed(1)+'%';

function parseAmount(s){
  if(typeof s==='number') return isFinite(s)?s:NaN;
  if(s==null) return NaN;
  let t=String(s).trim(); if(t==='') return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(t)){ neg=true; t=t.slice(1,-1).trim(); }   // accounting negatives
  t=t.replace(/[\s,$£€¥]/g,'');                                  // strip spaces, thousands, currency
  if(/^-/.test(t)){ neg=true; t=t.slice(1); }                   // only a LEADING minus is negative
  if(!/^\d*\.?\d+$/.test(t)) return NaN;                         // must be a clean number now (rejects e.g. INV-1001)
  let v=parseFloat(t);
  return isNaN(v)?NaN:(neg?-v:v);
}
function parseDelimited(text){
  const firstLine=(text.split(/\r?\n/)[0]||'');
  const delim=(firstLine.split('\t').length>firstLine.split(',').length)?'\t':',';
  const rows=[]; let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===delim){ row.push(field); field=''; }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(ch==='\r'){}
      else field+=ch;
    }
  }
  if(field.length>0||row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1&&r[0].trim()===''));
}
function toCSV(rows){
  return rows.map(r=>r.map(c=>{
    const s=c==null?'':String(c);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\n');
}

}

// Save text to a user-chosen location via the File System Access API where available
// (served over http/https); otherwise fall back to a normal download. Async.
async function saveTextFile(filename, text, mime, ext, desc){
  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({ suggestedName:filename,
        types:[{ description:desc||'File', accept:{ [mime]:[ext] } }] });
      const w=await handle.createWritable();
      await w.write(text); await w.close();

    }catch(e){

      // otherwise (e.g. blocked on file://) fall through to a normal download
    }
  }
  triggerDownload(filename, new Blob([text],{type:mime+';charset=utf-8;'}));
  return {ok:true, picked:false};
}

/* Population fingerprint — proves "same file" on reperformance.
   SHA-256 where available (localhost/https); FNV-1a fallback elsewhere. */
async function computeFingerprint(text){
  try{
    if(window.crypto && crypto.subtle){
      const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return {algo:'SHA-256', hash:[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')};
    }
  }catch(e){}
  let h=0x811c9dc5>>>0;
  for(let i=0;i<text.length;i++){ h^=text.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return {algo:'FNV-1a-32', hash:h.toString(16).padStart(8,'0')};
}

// build CSV rows for a saved sample record (metadata + selected items, incl. any audited values)
function sampleRecToCSV(rec){
  const neg = rec.sampleBasis==='negative';
  const ex = rec.exclusions||{};
  const rows=[
    ["Monetary Unit Sampling — saved sample"],
    ["Tool version", rec.toolVersion||TOOL_VERSION],
    ["Name", rec.name||""],
    ["Performed by", rec.performedBy||""],
    ["Selection run at", rec.runAt? new Date(rec.runAt).toLocaleString('en-AU') : ""],
    ["Saved at", rec.savedAt? new Date(rec.savedAt).toLocaleString('en-AU') : ""],
    ["Sample basis", neg?"Negative values":"Positive values"],
    ["Amount column", rec.amountColName||""],
    ["Reference column", rec.refColName||""],
    ["First row is header", rec.hasHeader===false?"No":"Yes"],
    ["Sorted by reference before selection", rec.sortedByRef?"Yes":"No (file order)"],
    ["Excluded - totals/subtotal rows", ex.totals!=null?ex.totals:""],
    ["Excluded - wrong sign / zero", ex.wrongSign!=null?ex.wrongSign:""],
    ["Excluded - unparsed rows", ex.unparsed!=null?ex.unparsed:""],
    ["Population fingerprint", rec.fingerprint? (rec.fingerprint.algo+" "+rec.fingerprint.hash) : ""],
    ["Expected error", (rec.ee||"")+" EE$"],["Confidence", (rec.confidence||"")+"%"],
    ["Materiality", (rec.materiality||"")+"%"],["Population items", rec.popCount!=null?rec.popCount:""],
    ["Population value (absolute)", (rec.total||0).toFixed(2)],["Planned sample size", rec.sampleSize!=null?rec.sampleSize:""],
    ["Sampling interval", (rec.interval||0).toFixed(2)],["Random start", (rec.randomStart||0).toFixed(2)],
    ["Items selected", (rec.items||[]).length],[""],
    neg ? ["Reference","Amount (absolute)","Original (signed) amount","Type","Audited value","Status","Anomaly justification"]
        : ["Reference","Book value","Type","Audited value","Status","Anomaly justification"]
  ];
  const un=rec.unable||{}, an=rec.anomaly||{};
  (rec.items||[]).forEach(it=>{
    const a = rec.audited && rec.audited[it.origIndex];
    const aud = (a!=null && String(a).trim()!=='') ? a : "";
    const status = un[it.origIndex] ? "Unable to test" : an[it.origIndex] ? "Anomaly" : (aud!==""?"Tested":"Not yet tested");
    const just = an[it.origIndex] ? (an[it.origIndex].just||"") : "";
    rows.push(neg
      ? [it.ref, it.amount.toFixed(2), (it.signed!=null?it.signed.toFixed(2):''), it.isKey?"Key item":"Sample item", aud, status, just]
      : [it.ref, it.amount.toFixed(2), it.isKey?"Key item":"Sample item", aud, status, just]);
  });
  return rows;
}

// parse a CSV produced by sampleRecToCSV back into a saved-sample record
function csvToSampleRec(text){
  const rows=parseDelimited(text); if(!rows.length) return null;
  const meta={}; let h=-1;
  for(let i=0;i<rows.length;i++){
    if((rows[i][0]||'')==='Reference'){ h=i; break; }
    if(rows[i].length>=2) meta[rows[i][0]]=rows[i][1];
  }
  if(h<0) return null;
  const neg=String(meta['Sample basis']||'').toLowerCase().includes('negative');
  const header=rows[h].map(c=>String(c).toLowerCase());
  const find=(t,dflt)=>{ const i=header.findIndex(c=>c.includes(t)); return i>=0?i:dflt; };
  const iAmt=find('absolute', find('book value',1));
  const iSigned=find('signed',-1), iType=find('type', neg?3:2), iAud=find('audited',-1);
  const iStatus=find('status',-1), iJust=find('justification',-1);
  const numv=s=>{ const v=parseFloat(String(s==null?'':s).replace(/[^0-9.\-]/g,'')); return isNaN(v)?0:v; };
  const items=[]; const audited={}; const unable={}; const anomaly={};
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]; if(!r||(r[0]||'').toString().trim()==='') continue;
    const amount=numv(r[iAmt]); if(!amount) continue;
    const oi=items.length;
    const signed = neg ? (iSigned>=0?numv(r[iSigned]):-amount) : amount;
    items.push({ref:(r[0]||'').toString(), amount, signed, origIndex:oi,
      isKey:/key/i.test(r[iType]||''), nHits:1, cumStart:0, cumEnd:0});
    const a=iAud>=0?r[iAud]:null; if(a!=null && String(a).trim()!=='') audited[oi]=String(a).trim();
    const stv=iStatus>=0? String(r[iStatus]||'').toLowerCase() : '';
    if(stv.includes('unable')) unable[oi]=true;
    if(stv.includes('anomaly')) anomaly[oi]={just: iJust>=0? String(r[iJust]||'') : '', by:'', at:''};
  }
  if(!items.length) return null;
  const fpRaw=String(meta['Population fingerprint']||'').trim();
  const fpm=fpRaw? fpRaw.match(/^(\S+)\s+(\S+)$/):null;
  return {
    name: meta['Name']||'Imported sample', performedBy: meta['Performed by']||'',
    toolVersion: meta['Tool version']||'', runAt:'',
    sampleBasis: neg?'negative':'positive',
    amountColName: meta['Amount column']||'', refColName: meta['Reference column']||'',
    hasHeader: String(meta['First row is header']||'Yes').toLowerCase()!=='no',
    sortedByRef: String(meta['Sorted by reference before selection']||'').toLowerCase().startsWith('y'),
    exclusions:{ totals:numv(meta['Excluded - totals/subtotal rows']),
      wrongSign:numv(meta['Excluded - wrong sign / zero']), unparsed:numv(meta['Excluded - unparsed rows']) },
    fingerprint: fpm? {algo:fpm[1], hash:fpm[2]} : null,
    ee: (String(meta['Expected error']||'Low').trim().split(/\s+/)[0])||'Low',
    confidence: numv(meta['Confidence'])||95, materiality: numv(meta['Materiality'])||5,
    popCount: numv(meta['Population items']), total: numv(meta['Population value (absolute)']),
    sampleSize: numv(meta['Planned sample size']), interval: numv(meta['Sampling interval']),
    randomStart: numv(meta['Random start']), materialityDollar:'', items, audited, unable, anomaly
  };
}

// parse a downloaded evaluation CSV (from "Download evaluation") back into a

function csvToEvalRec(text){
  const rows=parseDelimited(text); if(!rows.length) return null;

    if((rows[i][0]||'')==='Reference'){ h=i; break; }

  }

  const header=rows[h].map(c=>String(c).toLowerCase());

  const iBook=find('book value', find('amount', 1)), iAud=find('audited', 2), iType=find('type', header.length-1);
  const iStatus=find('status',-1), iJust=find('justification',-1);
  const numv=s=>{ const v=parseFloat(String(s==null?'':s).replace(/[^0-9.\-]/g,'')); return isNaN(v)?0:v; };
  const neg=String(meta['Sample basis']||'').toLowerCase().includes('negative');
  const items=[]; const audited={}; const unable={}; const anomaly={};

    const book=numv(r[iBook]); if(!book) continue;

      isKey:/key/i.test(r[iType]||''), nHits:1, cumStart:0, cumEnd:0});
    const a=r[iAud]; if(a!=null && String(a).trim()!=='') audited[oi]=String(a).trim();
    const stv=iStatus>=0? String(r[iStatus]||'').toLowerCase() : '';
    if(stv.includes('unable')) unable[oi]=true;
    if(stv.includes('anomaly')) anomaly[oi]={just: iJust>=0? String(r[iJust]||'') : '', by:'', at:''};
  }
  if(!items.length) return null;
  const total=items.reduce((s,x)=>s+x.amount,0);

/* ============================================================
   MUS selection — TWO-STRATUM
   1) every item >= the sampling interval is a CERTAINTY ("key") item:
      examined in full and counted ONCE (never selected more than once);
   2) the remaining sub-interval population is selected by systematic
      probability-proportional-to-size MUS at the interval.
   items: [{ref, amount(>0), signed, origIndex}]
   ============================================================ */
function runSelection(items, interval, randomStart){
  const eps=1e-6;
  const sel=[];
  let nextHit=randomStart, rcum=0;
  for(const it of items){
    if(it.amount>=interval-eps){
      sel.push({...it, isKey:true, nHits:1});                  // certainty item, once
    } else {
      rcum+=it.amount;                                         // residual cumulative
      let hit=false;
      while(nextHit<=rcum+eps){ hit=true; nextHit+=interval; } // item < interval => <=1 hit
      if(hit) sel.push({...it, isKey:false, nHits:1});
    }
  }
  sel.sort((a,b)=>a.origIndex-b.origIndex);
  // population running cumulative, for display only
  const cum={}; let c=0;
  for(const it of items){ c+=it.amount; cum[it.origIndex]=c; }
  for(const r of sel) r.cumEnd=cum[r.origIndex];
  return sel;
}

/* Derive the residual sampling interval so the two-stratum sample yields ~n
   DISTINCT items: certainty items (>= interval) are removed and the interval is
   recomputed over the remainder until the certainty set is stable. Because the
   recomputed interval is smaller, items below the original P/n interval but above
   the recomputed one also become certainties. */
function residualInterval(items, n){
  const eps=1e-6;
  const P=items.reduce((s,x)=>s+x.amount,0);
  if(P<=0||n<1) return 0;
  let interval=P/n, prevKc=-1;
  for(let g=0; g<items.length+10; g++){
    let kt=0,kc=0;
    for(const it of items){ if(it.amount>=interval-eps){ kt+=it.amount; kc++; } }
    const rN=n-kc;
    if(rN<=0) return P/n;                  // more certainty items than n: fall back
    const ni=(P-kt)/rN;
    if(kc===prevKc || Math.abs(ni-interval)<eps) return ni;
    prevKc=kc; interval=ni;
  }
  return interval;
}

/* ============================================================
   Evaluation — projection of misstatements (Stringer bound)

   Per-item status model (ASA 530 paras 10–13):
   · tested    — audited value entered (and any >100% tainting confirmed)
   · pending   — entered value implies >100% tainting, awaiting confirmation
   · unable    — could not be tested → treated as FULLY misstated (para 11)
   · untested  — no value yet → contributes nothing; conclusion is withheld
   Key items use their ACTUAL misstatement uncapped (100% examined — no
   projection). Sampled taints are capped at ±100% for the Stringer maths only;
   any excess over book is reported separately. Anomalies (para 13) are
   excluded from the projection but their actual error still counts.
   ============================================================ */
function evaluateSample(selected, auditedMap, interval, confFrac, opts){
  const o=opts||{}; const unable=o.unable||{}, anomalyMap=o.anomaly||{}, confirmed=o.confirmedOver||{};
  const eps=1e-9;
  const rf=(k)=>reliabilityFactor(confFrac,k);
  let keyOver=0, keyUnder=0, nCapped=0, excessOver=0, excessUnder=0;
  const overList=[], underList=[];          // {taint, ref} — sampled, non-anomaly
  const anomalies=[];                        // excluded from projection
  let altKeyOver=0; const altOverExtra=[];   // "as representative" add-backs for anomalies
  const rows=selected.map(it=>{
    const book=it.amount;
    const raw=auditedMap[it.origIndex];
    const hasAud = raw!=null && String(raw).trim()!=='' && !isNaN(parseFloat(raw));
    const audited= hasAud ? parseFloat(raw) : null;
    const isUnable=!!unable[it.origIndex];
    let misst   = hasAud ? (book-audited) : 0;           // actual book − audited (+ve = overstatement)
    let rawTaint= (hasAud && book!==0) ? misst/book : 0;
    if(isUnable){ misst=book; rawTaint=1; }              // ASA 530.11 — unable to test = fully misstated
    const overCap = !isUnable && hasAud && Math.abs(rawTaint) > 1+eps;
    const needsConfirm = overCap && !confirmed[it.origIndex];
    const status = isUnable?'unable' : !hasAud?'untested' : needsConfirm?'pending' : 'tested';
    const isAnomaly = status==='tested' && !!anomalyMap[it.origIndex] && Math.abs(misst)>1e-6;
    const taint = Math.max(-1, Math.min(1, rawTaint));   // Stringer needs taints in [-1,1]
    if(status==='tested' && overCap) nCapped++;
    let projected=0;
    if(status==='tested' || status==='unable'){
      if(isAnomaly){
        projected=misst;                                  // actual error still counts — just not projected
        anomalies.push({ref:it.ref, misst, taint, isKey:!!it.isKey,
          just:(anomalyMap[it.origIndex]||{}).just||'', by:(anomalyMap[it.origIndex]||{}).by||'',
          at:(anomalyMap[it.origIndex]||{}).at||''});
        if(it.isKey){ if(misst>0) altKeyOver+=misst; }
        else if(taint>0) altOverExtra.push(taint);
      } else if(it.isKey){
        projected=misst;                                  // 100% examined — actual, UNCAPPED
        if(misst>0) keyOver+=misst; else if(misst<0) keyUnder+=(-misst);
      } else {
        projected=taint*interval;
        if(taint>0) overList.push({taint, ref:it.ref});
        else if(taint<0) underList.push({taint:-taint, ref:it.ref});
        if(overCap){ if(rawTaint>0) excessOver+=(misst-book); else excessUnder+=((-misst)-book); }
      }
    }
    return {...it, book, audited, hasAud, misst, taint, rawTaint,
      capped:overCap, status, isAnomaly, projected};
  });
  overList.sort((a,b)=>b.taint-a.taint); underList.sort((a,b)=>b.taint-a.taint);
  const overTaints=overList.map(x=>x.taint), underTaints=underList.map(x=>x.taint);
  const RF0=rf(0);
  const basicPrecision=RF0*interval;
  const mleOver = overTaints.reduce((s,t)=>s+t*interval,0)+keyOver;
  const mleUnder= underTaints.reduce((s,t)=>s+t*interval,0)+keyUnder;
  let umlSum=RF0;
  const overSchedule=overList.map((x,i)=>{ const inc=rf(i+1)-rf(i); umlSum+=x.taint*inc;
    return {rank:i+1, ref:x.ref, taint:x.taint, rfFrom:rf(i), rfTo:rf(i+1), inc, contribution:x.taint*inc*interval}; });
  const uml=umlSum*interval+keyOver;
  let llSum=RF0;  for(let i=0;i<underTaints.length;i++) llSum +=underTaints[i]*(rf(i+1)-rf(i));
  const lowerLimit=llSum*interval+keyUnder;
  // "anomalies as representative" alternative UML (shown so the judgement is visible)
  let umlIncl=uml;
  if(anomalies.length){
    const allOver=overTaints.concat(altOverExtra).sort((a,b)=>b-a);
    let s2=RF0; for(let i=0;i<allOver.length;i++) s2+=allOver[i]*(rf(i+1)-rf(i));
    umlIncl=s2*interval+keyOver+altKeyOver;
  }
  const counts={ untested:rows.filter(r=>r.status==='untested').length,
    pending:rows.filter(r=>r.status==='pending').length,
    unable:rows.filter(r=>r.status==='unable').length,
    tested:rows.filter(r=>r.status==='tested').length };
  const anomalyMLE=anomalies.reduce((s,a)=>s+a.misst,0);
  return {rows, basicPrecision, mleOver, mleUnder, netMLE:mleOver-mleUnder,
    uml, umlIncl, lowerLimit, allowance:uml-mleOver, RF0, nCapped, excessOver, excessUnder,
    keyOver, keyUnder, anomalies, anomalyMLE, overSchedule,
    rfList:Array.from({length:overTaints.length+1},(_,k)=>rf(k)),
    nOver:overTaints.length, nUnder:underTaints.length,
    nKey:selected.filter(s=>s.isKey).length,
    nTested:counts.tested+counts.unable, counts,
    ready: counts.untested===0 && counts.pending===0};
}

  return n.toLocaleString('en-AU',{maximumFractionDigits:2}); }
function NumText({value,onChange,disabled,placeholder,style,ariaLabel}){

/* ---------------- Step 2: Select sample ---------------- */
function StepSelect({S}){
  const fileRef=useRef();
  const [fileMsg,setFileMsg]=useState(null);
  const [listModal,setListModal]=useState(null);      // {title, rows:[{ref,raw}]}
  const [selQ,setSelQ]=useState('');                  // search within the selected sample
  const [selSort,setSelSort]=useState(null);          // null | 'ref' | 'amt'
  const parsed = useMemo(()=> S.rawData.trim()? parseDelimited(S.rawData):[], [S.rawData]);
  const headerRow = parsed.length? parsed[0]:[];
  const colCount = parsed.reduce((m,r)=>Math.max(m,r.length),0);
  const colNames = S.hasHeader
    ? Array.from({length:colCount},(_,i)=> (headerRow[i]&&headerRow[i].trim())||("Column "+(i+1)))
    : Array.from({length:colCount},(_,i)=>"Column "+(i+1));
  const bodyRows = S.hasHeader? parsed.slice(1):parsed;

  // auto-detect amount + reference columns when data changes
  useEffect(()=>{
    if(!parsed.length) return;
    let best=-1,bestScore=-1;
    for(let c=0;c<colCount;c++){
      let good=0; for(const r of bodyRows){ if(!isNaN(parseAmount(r[c]))) good++; }
      let score=good;
      if(/amount|value|balance|total|gross|\bnet\b|debit|credit|\$|cost|price|\bsum\b/i.test(colNames[c]||'')) score+=1e6;
      if(score>bestScore){bestScore=score;best=c;}
    }
    let ref=-1,refScore=-1;
    for(let c=0;c<colCount;c++){
      if(c===best) continue;
      let sc = c<best?1:0;
      if(/ref|id|number|\bno\b|invoice|name|customer|supplier|vendor|description|account|doc/i.test(colNames[c]||'')) sc+=10;
      if(sc>refScore){refScore=sc;ref=c;}
    }
    S.set({amountCol:best<0?0:best, refCol:ref});
  // eslint-disable-next-line
  },[S.rawData,S.hasHeader]);

  const pop = useMemo(()=>{
    const items=[]; let excludedWrongSign=0, badParse=0, excludedTotals=0;
    const unparsed=[], wrongSignRows=[], totalsRows=[];
    const CAP=400;
    const wantNeg = S.sampleBasis==='negative';
    // a totals/subtotal row: some cell is exactly "Total"/"Totals"/"Grand total"/"Subtotal"/"Sum"
    // (whole-cell match, so a supplier like "TotalEnergies" is NOT excluded)
    const TOTAL_RE=/^\s*(grand\s+)?(sub[\s-]?)?totals?\s*:?\s*$|^\s*sum\s*:?\s*$/i;
    const refOf=(r,i)=> S.refCol>=0 ? ((r[S.refCol]??'').toString().trim()||('Row '+(i+1))) : ('Row '+(i+1));
    bodyRows.forEach((r,i)=>{
      if(r.some(c=>TOTAL_RE.test(String(c==null?'':c)))){ excludedTotals++;
        if(totalsRows.length<CAP) totalsRows.push({ref:refOf(r,i), raw:String(r[S.amountCol]==null?'':r[S.amountCol]).trim().slice(0,40)});
        return; }
      const v=parseAmount(r[S.amountCol]);
      if(isNaN(v)){ badParse++;
        if(unparsed.length<CAP) unparsed.push({ref:refOf(r,i), raw:String(r[S.amountCol]==null?'':r[S.amountCol]).trim().slice(0,40)});
        return; }
      if(wantNeg ? v>=0 : v<=0){ excludedWrongSign++;
        if(wrongSignRows.length<CAP) wrongSignRows.push({ref:refOf(r,i), raw:money(v)});
        return; }
      items.push({ref:refOf(r,i), amount:Math.abs(v), signed:v, origIndex:i}); // MUS runs on the absolute amount
    });
    // optional deterministic ordering: sort by reference so the selection is
    // reconstructable from the data itself (reperformance evidence)
    if(S.sortByRef) items.sort((a,b)=>String(a.ref).localeCompare(String(b.ref),undefined,{numeric:true,sensitivity:'base'}));
    const total=items.reduce((s,x)=>s+x.amount,0);
    return {items,total,count:items.length,excludedWrongSign,badParse,excludedTotals,
      unparsed,wrongSignRows,totalsRows,wantNeg};
  },[bodyRows,S.amountCol,S.refCol,S.sampleBasis,S.sortByRef]);

  // population fingerprint — recomputed whenever the effective population changes
  useEffect(()=>{
    let alive=true;
    if(pop.count===0){ S.set({fingerprint:null}); return; }
    const text=pop.items.map(it=>it.ref+'|'+it.amount.toFixed(2)).join('\n');
    computeFingerprint(text).then(fp=>{ if(alive) S.set({fingerprint:{...fp, rows:pop.count, total:pop.total}}); });
    return ()=>{ alive=false; };
  // eslint-disable-next-line
  },[pop.items]);

  // default interval = the two-stratum residual interval (yields ~n distinct items),
  // until the user enters their own
  const suggestedInterval = useMemo(()=> pop.count>0 && S.sampleSize>0 ? residualInterval(pop.items,S.sampleSize) : 0,
    [pop.items,pop.count,S.sampleSize]);
  useEffect(()=>{
    if(!S.intervalTouched && suggestedInterval>0)
      S.set({interval:suggestedInterval.toFixed(2)});
  // eslint-disable-next-line
  },[suggestedInterval,S.intervalTouched]);

  const intervalNum=parseFloat(S.interval);
  const startNum=parseFloat(S.randomStart);
  const intervalOk = intervalNum>0 && isFinite(intervalNum);
  const startOk = startNum>0 && startNum<=intervalNum+1e-6;
  const keyCountAtInterval = useMemo(()=> intervalOk ? pop.items.filter(it=>it.amount>=intervalNum-1e-6).length : 0,
    [pop.items,intervalNum,intervalOk]);

  // auto-populate a random start when the interval is valid and none is set (or it became invalid)
  useEffect(()=>{
    if(intervalOk && !(startNum>0 && startNum<=intervalNum+1e-6)){
      let r=Math.random()*intervalNum; if(r<=0) r=intervalNum*0.5;
      S.set({randomStart:r.toFixed(2)});
    }
  // eslint-disable-next-line
  },[intervalNum,intervalOk]);

  function genStart(){
    if(!intervalOk) return;
    let r=Math.random()*intervalNum; if(r<=0) r=intervalNum*0.5;
    S.set({randomStart:r.toFixed(2)});
  }
  function loadFile(e){
    const f=e.target.files[0]; if(!f) return;
    setFileMsg(null);
    const isExcel=/\.(xlsx|xlsm|xls)$/i.test(f.name);
    const rd=new FileReader();
    if(isExcel){
      if(!window.XLSX){ setFileMsg({t:'err',m:'Excel support could not load (no internet connection?) — save the file as CSV and upload that instead.'}); e.target.value=''; return; }
      rd.onload=()=>{ try{
          const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const csv=XLSX.utils.sheet_to_csv(ws);
          S.set({rawData:csv, intervalTouched:false, selection:null});
          setFileMsg({t:'ok',m:'Read “'+f.name+'” — first sheet ('+wb.SheetNames[0]+').'+(wb.SheetNames.length>1?' Workbook has '+wb.SheetNames.length+' sheets; only the first is used.':'')});
        }catch(err){ setFileMsg({t:'err',m:'Could not read that Excel file — save it as CSV and upload that instead.'}); } };
      rd.readAsArrayBuffer(f);
    } else {
      rd.onload=()=>S.set({rawData:rd.result, intervalTouched:false});
      rd.readAsText(f);
    }
    e.target.value='';
  }
  function loadSample(){
    const lines=["Reference,Customer,Amount"];
    let s=987654321; const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
    const N=300;                                            // population >> sample size
    for(let i=1;i<=N;i++){
      let v; const r=rnd();
      if(i<=4) v=Math.round(60000+rnd()*70000);            // a few large balances (become key items)
      else if(r<0.15) v=Math.round(8000+rnd()*16000);      // some mid-size items
      else v=Math.round(150+rnd()*6000);                   // many smaller items
      lines.push(`INV-${1000+i},Customer ${((i*37)%120)+1},${v}`);
    }
    S.set({rawData:lines.join("\n"), hasHeader:true, intervalTouched:false, selection:null});
  }
  function doSelect(){
    if(!intervalOk||!startOk||pop.count===0) return;
    const sel=runSelection(pop.items,intervalNum,startNum);
    const keyItems=sel.filter(i=>i.isKey);
    const keyValue=keyItems.reduce((s,x)=>s+x.amount,0);
    S.set({selection:{items:sel, interval:intervalNum, randomStart:startNum,
      sampleSize:S.sampleSize, total:pop.total, popCount:pop.count,
      ee:S.ee, confidence:S.confidence, materiality:S.materiality, sampleBasis:S.sampleBasis,
      // reperformance evidence
      amountColName: colNames[S.amountCol]||('Column '+(S.amountCol+1)),
      refColName: S.refCol>=0 ? (colNames[S.refCol]||('Column '+(S.refCol+1))) : 'row number',
      hasHeader:S.hasHeader, sortedByRef:!!S.sortByRef,
      exclusions:{totals:pop.excludedTotals, wrongSign:pop.excludedWrongSign, unparsed:pop.badParse},
      fingerprint:S.fingerprint, runAt:new Date().toISOString(), toolVersion:TOOL_VERSION,
      keyCount:keyItems.length, keyValue, residValue:pop.total-keyValue},
      audited:{}, unable:{}, confirmedOver:{}, anomaly:{}, materialityDollar:'', loadedName:''});
  }
  function exportSel(){
    const sel=S.selection; if(!sel) return;
    const neg=sel.sampleBasis==='negative';
    const ex=sel.exclusions||{};
    const meta=[
      ["Monetary Unit Sampling — selected sample"],
      ["Tool version",sel.toolVersion||TOOL_VERSION],
      ["Selection run at",sel.runAt? new Date(sel.runAt).toLocaleString('en-AU'):""],
      ["Performed by",S.username||""],
      ["Sample basis",neg?"Negative values":"Positive values"],
      ["Amount column",sel.amountColName||""],
      ["Reference column",sel.refColName||""],
      ["First row is header",sel.hasHeader===false?"No":"Yes"],
      ["Sorted by reference before selection",sel.sortedByRef?"Yes":"No (file order)"],
      ["Excluded - totals/subtotal rows",ex.totals!=null?ex.totals:""],
      ["Excluded - wrong sign / zero",ex.wrongSign!=null?ex.wrongSign:""],
      ["Excluded - unparsed rows",ex.unparsed!=null?ex.unparsed:""],
      ["Population fingerprint",sel.fingerprint? (sel.fingerprint.algo+" "+sel.fingerprint.hash):""],
      ["Expected error",sel.ee+" EE$"],["Confidence",sel.confidence+"%"],
      ["Materiality",sel.materiality+"%"],["Population items",sel.popCount],
      ["Population value (absolute)",sel.total.toFixed(2)],["Planned sample size",sel.sampleSize],
      ["Sampling interval",sel.interval.toFixed(2)],["Random start",sel.randomStart.toFixed(2)],
      ["Key items (>= interval)",(sel.keyCount!=null?sel.keyCount:sel.items.filter(i=>i.isKey).length)+" totalling "+(sel.keyValue!=null?sel.keyValue.toFixed(2):"")],
      ["Residual population (sampled stratum)",sel.residValue!=null?sel.residValue.toFixed(2):""],
      ["Items selected",sel.items.length],[""],
      neg ? ["Reference","Amount (absolute)","Original (signed) amount","Cumulative","Type","Hits"]
          : ["Reference","Book value","Cumulative","Type","Hits"]
    ];
    sel.items.forEach(r=> meta.push(
      neg ? [r.ref,r.amount.toFixed(2),(r.signed!=null?r.signed.toFixed(2):''),r.cumEnd.toFixed(2),r.isKey?"Key item (100%)":"Sample item",r.nHits]
          : [r.ref,r.amount.toFixed(2),r.cumEnd.toFixed(2),r.isKey?"Key item (100%)":"Sample item",r.nHits]));
    saveTextFile(baseName(S.username,sel.sampleBasis)+".csv", toCSV(meta), 'text/csv', '.csv', 'CSV file');
  }

  const sel=S.selection;
  // live values for the working-paper note (use the drawn sample if present, else current inputs)
  const noteInterval = sel? sel.interval : intervalNum;
  const noteStart = sel? sel.randomStart : startNum;
  const noteCount = sel? sel.popCount : pop.count;
  const noteTotal = sel? sel.total : pop.total;
  const noteSize = sel? sel.sampleSize : S.sampleSize;
  const noteNeg = sel? sel.sampleBasis==='negative' : pop.wantNeg;
  const amountColName = colNames[S.amountCol]||'Amount';
  const noteReady = noteCount>0;
  return (
    <div className="card">
      <h2><span className="step-no">Step 2.</span> Select the sample (Monetary Unit Sampling)</h2>
      <p className="sub">Load your population, pick the amount column, set the sampling interval and a random
        start, then draw a probability-proportional-to-size sample.</p>

      <h3>1 · Population data</h3>
      <div className="row" style={{marginBottom:8}}>
        <button className="btn ghost sm" onClick={()=>fileRef.current.click()}>Upload Excel / CSV…</button>
        <input ref={fileRef} type="file" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls" style={{display:'none'}} onChange={loadFile}/>
        <button className="btn ghost sm" onClick={loadSample}>Load example data</button>
        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5,marginLeft:6}}>
          <input type="checkbox" checked={S.hasHeader} onChange={e=>S.set({hasHeader:e.target.checked})}/>
          First row is a header
        </label>
        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5}}>
          <input type="checkbox" checked={!!S.sortByRef}
            onChange={e=>S.set({sortByRef:e.target.checked, selection:null, intervalTouched:false})}/>
          Sort by reference before selecting
          <Q t="Orders the population by the reference column before selection, so the selection order is reconstructable from the data itself — recommended for reperformance. Off = rows are used in file order."/>
        </label>
        {S.rawData && <button className="btn ghost sm" onClick={()=>S.set({rawData:'',selection:null})}>Clear</button>}
      </div>
      {fileMsg && <div className={fileMsg.t==='ok'?'note':'err'} style={{marginBottom:8}}>{fileMsg.m}</div>}
      <textarea placeholder="Paste rows from Excel or a CSV here — e.g.&#10;Reference, Customer, Amount&#10;INV-1001, Acme, 4820.55&#10;INV-1002, Globex, 92140.00"
        value={S.rawData} onChange={e=>S.set({rawData:e.target.value, intervalTouched:false})}/>

      <div className="row" style={{marginTop:12,gap:16,alignItems:'flex-start'}}>
        <div>
          <label className="fld">Sample basis</label>
          <div className="seg" style={{minWidth:260}} role="group" aria-label="Sample basis">
            <button className={S.sampleBasis!=='negative'?"on":""} aria-pressed={S.sampleBasis!=='negative'}
              onClick={()=>S.set({sampleBasis:'positive',intervalTouched:false,selection:null})}>Positive values</button>
            <button className={S.sampleBasis==='negative'?"on":""} aria-pressed={S.sampleBasis==='negative'}
              onClick={()=>S.set({sampleBasis:'negative',intervalTouched:false,selection:null})}>Negative values</button>
          </div>
        </div>
        <div className="hint" style={{maxWidth:420,paddingTop:22}}>
          {S.sampleBasis==='negative'
            ? "Sampling the negative population (e.g. credit notes / refunds) on absolute amounts."
            : "Sampling the positive population — the usual MUS basis for overstatement testing."}
        </div>
      </div>

      {parsed.length>0 && (
        <div className="grid g2" style={{marginTop:12}}>
          <div>
            <label className="fld">Amount column <span className="hint">(sampling is based on this)</span></label>
            <select value={S.amountCol} onChange={e=>S.set({amountCol:+e.target.value,intervalTouched:false})}>
              {colNames.map((n,i)=><option key={i} value={i}>{n}</option>)}
            </select>
          </div>
          <div>
            <label className="fld">Reference / ID column <span className="hint">(optional)</span></label>
            <select value={S.refCol} onChange={e=>S.set({refCol:+e.target.value})}>
              <option value={-1}>— use row number —</option>
              {colNames.map((n,i)=><option key={i} value={i}>{n}</option>)}
            </select>
          </div>
        </div>
      )}

      {parsed.length>0 && (
        <>
          <div className="hint" style={{margin:'12px 0 4px'}}>Preview — first rows as read
            (<span style={{background:'var(--brand-fill)',padding:'0 5px',borderRadius:3,color:'var(--brand-press)'}}>amount</span> and
            {' '}<span style={{background:'var(--bg-hover)',padding:'0 5px',borderRadius:3}}>reference</span> columns highlighted):</div>
          <div className="scrollx" style={{maxHeight:220}}>
            <table className="data">
              <thead><tr>{colNames.map((n,i)=>
                <th key={i} className={i===S.amountCol?'hl-amt':(i===S.refCol?'hl-ref':'')}>{n}</th>)}</tr></thead>
              <tbody>
                {bodyRows.slice(0,8).map((r,ri)=>(
                  <tr key={ri}>{colNames.map((n,ci)=>
                    <td key={ci} className={ci===S.amountCol?'hl-amt':(ci===S.refCol?'hl-ref':'')}>{String(r[ci]==null?'':r[ci]).slice(0,60)}</td>)}</tr>
                ))}
              </tbody>
            </table>
          </div>
          {bodyRows.length>8 && <div className="hint" style={{marginTop:3}}>…and {num0(bodyRows.length-8)} more rows.</div>}
        </>
      )}

      {parsed.length>0 && (
        <div className="statgrid" style={{marginTop:14}}>
          <Stat k={pop.wantNeg?"Negative items":"Population items"} v={num0(pop.count)}/>
          <Stat k={pop.wantNeg?"Population value (abs)":"Population book value"} v={money(pop.total)}
            title={S.fingerprint? 'Fingerprint: '+fpShort(S.fingerprint):undefined}/>
          <Stat k={pop.wantNeg?"Excluded (≥ 0)":"Excluded (≤ 0)"} v={num0(pop.excludedWrongSign)}
            title={pop.excludedWrongSign>0?'Click to list the excluded rows':undefined}
            onClick={pop.excludedWrongSign>0? ()=>setListModal({title:'Excluded — wrong sign or zero ('+num0(pop.excludedWrongSign)+')',
              rows:pop.wrongSignRows, more:pop.excludedWrongSign-pop.wrongSignRows.length}) : undefined}/>
          <Stat k="Unparsed rows" v={num0(pop.badParse)}
            title={pop.badParse>0?'Click to list the rows that could not be read':undefined}
            onClick={pop.badParse>0? ()=>setListModal({title:'Unparsed rows ('+num0(pop.badParse)+') — amount could not be read as a number',
              rows:pop.unparsed, more:pop.badParse-pop.unparsed.length}) : undefined}/>
        </div>
      )}
      {listModal && (
        <Dlg title={listModal.title} onClose={()=>setListModal(null)}
          foot={<button className="btn sm" onClick={()=>setListModal(null)}>Close</button>}>
          <table className="data"><thead><tr><th>Reference</th><th>Amount cell</th></tr></thead>
            <tbody>{listModal.rows.map((u,i)=><tr key={i}><td>{u.ref}</td><td>{u.raw}</td></tr>)}</tbody></table>
          {listModal.more>0 && <div className="hint" style={{marginTop:6}}>…and {num0(listModal.more)} more.</div>}
        </Dlg>
      )}
      {parsed.length>0 && (pop.excludedWrongSign>0||pop.badParse>0||pop.excludedTotals>0) &&
        <div className="note">
          {pop.excludedTotals>0 && <><b>{pop.excludedTotals} totals/subtotal row(s) ignored</b> (a cell reads “Total”, “Subtotal” or “Sum”). </>}
          {(pop.excludedWrongSign>0||pop.badParse>0) && (pop.wantNeg
            ? "Zero, positive or non-numeric items are excluded — only negative items are sampled here, on their absolute amounts. "
            : "Zero, negative or non-numeric items are excluded — MUS draws from positive book values only. ")}
          Test any excluded items separately.</div>}

      <h3>2 · Sampling parameters</h3>
      <div className="grid g3">
        <div>
          <label className="fld">Sample size (n)</label>
          <input type="number" value={S.sampleSize}
            onChange={e=>S.set({sampleSize:Math.max(1,+e.target.value||1),intervalTouched:false})}/>
          <div className="hint" style={{marginTop:5}}>From Step 1: {S.ee} EE$, {S.confidence}%, {S.materiality}%
            = <b>{SAMPLE_TABLES[S.ee][S.confidence][S.materiality]}</b>
            {S.sampleSize!==SAMPLE_TABLES[S.ee][S.confidence][S.materiality] &&
              <a style={{marginLeft:6,cursor:'pointer',color:'var(--teal)'}}
                onClick={()=>S.set({sampleSize:SAMPLE_TABLES[S.ee][S.confidence][S.materiality],intervalTouched:false})}>reset</a>}
          </div>
        </div>
        <div>
          <label className="fld">Sampling interval<Q t="The dollar stride between selections. Every item at or above the interval is examined in full (a key item); the rest are picked every interval-dollars along the population. Defaults to a value that yields about n distinct items."/></label>
          <NumText value={S.interval} ariaLabel="Sampling interval"
            onChange={v=>S.set({interval:v,intervalTouched:true})}/>
          <div className="hint" style={{marginTop:5}}>
            {intervalOk
              ? <><b>{num0(keyCountAtInterval)}</b> item(s) ≥ this interval are examined in full; the rest are MUS-sampled.</>
              : "Load data to derive the interval."}
            {S.intervalTouched && suggestedInterval>0 &&
              <a style={{marginLeft:6,cursor:'pointer',color:'var(--teal)'}}
                onClick={()=>S.set({interval:suggestedInterval.toFixed(2),intervalTouched:false})}>use suggested</a>}
          </div>
        </div>
        <div>
          <label className="fld">Random start <span className="hint">(0 &lt; start ≤ interval)</span><Q t="Where the first stride lands. This is the only random element — the same population order, interval and random start always reproduce the identical sample."/></label>
          <div className="row" style={{flexWrap:'nowrap'}}>
            <NumText value={S.randomStart} ariaLabel="Random start"
              onChange={v=>S.set({randomStart:v})}/>
            <button className="btn ghost sm" style={{flex:'none'}} onClick={genStart} disabled={!intervalOk}
              aria-label="Generate a new random start" title="Generate a new random start">↻</button>
          </div>
          <div className="hint" style={{marginTop:5}}>Document this for reproducibility.
            {!startOk && S.randomStart!=='' && <span className="err"> Must be &gt; 0 and ≤ interval.</span>}
          </div>
        </div>
      </div>

      <div className="row" style={{marginTop:16}}>
        <button className="btn primary" onClick={doSelect}
          disabled={!intervalOk||!startOk||pop.count===0}>Draw sample</button>
        {sel && <button className="btn ghost" onClick={exportSel}>Download selected sample (CSV)</button>}
        {sel && <button className="btn teal" onClick={()=>S.set({step:3})}>Enter audited values &rarr;</button>}
      </div>
      {pop.count===0 && parsed.length>0 && <div className="err">No {pop.wantNeg?"negative":"positive"} values found — check the amount column and the sample basis.</div>}

      {sel && (
        <>
          <h3>Selected sample — {sel.items.length} items
            ({sel.items.filter(i=>i.isKey).length} key, {sel.items.filter(i=>!i.isKey).length} sample)</h3>
          <div className="note">
            {sel.sampleBasis==='negative' && <><b>Negative-value basis:</b> amounts shown are absolute values of the selected negative (e.g. credit) items. </>}
            <b>{num0(sel.items.filter(i=>i.isKey).length)}</b> item(s) ≥ the interval pre-selected as <b>key items</b> (examined in full);
            the remaining <b>{num0(sel.items.filter(i=>!i.isKey).length)}</b> selected by MUS. Interval <b>{money(sel.interval)}</b> ·
            random start <b>{sel.randomStart>0?money(sel.randomStart):'not recorded'}</b> · no item is selected more than once.</div>
          <div className="row" style={{margin:'6px 0'}}>
            <input type="text" placeholder="Search reference…" value={selQ} onChange={e=>setSelQ(e.target.value)}
              style={{maxWidth:220}} aria-label="Search selected sample"/>
            <div className="seg" style={{maxWidth:300}}>
              {[[null,'Selection order'],['ref','Reference'],['amt','Amount ↓']].map(([k,l])=>(
                <button key={String(k)} className={selSort===k?'on':''} onClick={()=>setSelSort(k)}>{l}</button>))}
            </div>
          </div>
          <div className="scrollx">
            <table className="data">
              <thead><tr>
                <th>#</th><th>Reference</th><th className="num">Book value</th>
                <th className="num">Cumulative $</th><th>Type</th><th className="num">Hits</th>
              </tr></thead>
              <tbody>
                {sel.items
                  .map((r,i)=>({...r,__i:i}))
                  .filter(r=>!selQ.trim()||String(r.ref).toLowerCase().includes(selQ.trim().toLowerCase()))
                  .sort((a,b)=> selSort==='ref'? String(a.ref).localeCompare(String(b.ref),undefined,{numeric:true})
                              : selSort==='amt'? b.amount-a.amount : a.__i-b.__i)
                  .map(r=>(
                  <tr key={r.__i} className={r.isKey?"key-row":""}>
                    <td>{r.__i+1}</td><td>{r.ref}</td>
                    <td className="num">{money(r.amount)}</td>
                    <td className="num">{money(r.cumEnd)}</td>
                    <td><span className={"pill "+(r.isKey?"key":"smp")}>{r.isKey?"Key (100%)":"Sample"}</span></td>
                    <td className="num">{r.nHits}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}

      <details className="method"><summary>Selection methodology</summary>
        <div>This uses <b>two-stratum Monetary Unit Sampling</b>. First, every item whose value ≥ the sampling
        interval is an <b>individually significant ("key") item</b>, examined in full and counted once. The
        remaining sub-interval population is then selected by <b>systematic probability-proportional-to-size
        MUS</b> — accumulating book values and taking a hit every <code>interval</code> dollars from the random
        start, so larger items are more likely to be chosen. <b>No item is ever selected more than once.</b><br/><br/>
        The default interval is derived from your sample size so the total is about <code>n</code> distinct items;
        because removing key items lowers the interval, items below the original Population ÷ n interval but above
        the recomputed one also become key items. Reproduce a selection exactly by recording the population order,
        the interval and the random start.</div>
      </details>

      <h3>Example documentation — sample selection <span className="hint" style={{textTransform:'none',letterSpacing:0}}>· updates with your selections</span></h3>
      <div className="wp">
        <div className="lbl">Working-paper note — supplies &amp; services expenses</div>
        {noteReady ? <>
          <p><b>Method:</b> two-stratum Monetary Unit Sampling (individually significant items examined in full, then
            probability-proportional-to-size sampling of the remainder), performed with the MUS tool on the
            "{amountColName}" column, <b>{noteNeg?'negative':'positive'} values</b>.</p>
          <p><b>Population:</b> {num0(noteCount)} invoices for supplies and services, total {money(noteTotal)}{noteNeg?' (absolute value of credit/negative items)':''}.</p>
          <p><b>Parameters:</b> sample size {noteSize}; sampling interval {money(noteInterval)}; random start {noteStart>0?money(noteStart):'not recorded'}.</p>
          {sel
            ? <p><b>Result:</b> {sel.items.length} invoices selected — {sel.items.filter(i=>i.isKey).length} key items (≥ interval, examined in full) and {sel.items.filter(i=>!i.isKey).length} sample items. Performed by {S.username||'[initials]'} on {new Date().toLocaleDateString('en-AU')}.</p>
            : <p className="muted">Click <b>Draw sample</b> to record the invoices selected.</p>}
          <p><b>Reproducibility:</b> the population (in order), the interval and the random start are retained, and the selected invoices are exported to CSV / saved, so the selection can be re-performed.</p>
        </> : <p className="muted">Load your population and choose the sample basis — this note will populate automatically.</p>}
        <p className="ref">Ref: ASA 530 para 8 &amp; Appendix 1/4; ASA 230 para 9.</p>
      </div>

      <FilesPanel S={S} pop={pop}/>

      <div className="row no-print" style={{marginTop:16,justifyContent:'space-between'}}>
        <button className="btn" onClick={()=>S.set({step:1})}>&larr; Sample size</button>
        <button className="btn primary" disabled={!sel} onClick={()=>S.set({step:3})}>Next: Evaluate &rarr;</button>
      </div>
    </div>
  );
}

/* ---------------- Step 3: Evaluate ---------------- */
function StepEvaluate({S}){
  const sel=S.selection;
  const [evalMsg,setEvalMsg]=useState(null);
  const [filter,setFilter]=useState('all');
  const [q,setQ]=useState('');
  const [bulk,setBulk]=useState(null);          // {text, mode}
  const [anomOpen,setAnomOpen]=useState(null);  // origIndex being marked / edited
  const [anomJust,setAnomJust]=useState('');
  const matTouched=useRef(false);
  useEffect(()=>{
    if(sel && !matTouched.current && !S.materialityDollar)
      S.set({materialityDollar:(sel.total*sel.materiality/100).toFixed(2)});
  // eslint-disable-next-line
  },[sel]);
  // NOTE: all hooks must run unconditionally — sel can become set while this
  // component is already mounted, so nothing may sit behind the early return.
  const opts=useMemo(()=>({unable:S.unable||{}, anomaly:S.anomaly||{}, confirmedOver:S.confirmedOver||{}}),
    [S.unable,S.anomaly,S.confirmedOver]);
  const ev=useMemo(()=> sel? evaluateSample(sel.items,S.audited,sel.interval,sel.confidence/100,opts) : null,
    [sel,S.audited,opts]);
  // provisional range while incomplete: best case (rest clean) vs worst case (rest fully wrong)
  const range=useMemo(()=>{
    if(!sel||!ev||ev.ready) return null;
    const clean={...S.audited}; const worstUnable={...(S.unable||{})}; const conf={};
    sel.items.forEach(it=>{ conf[it.origIndex]=true; });
    ev.rows.forEach(r=>{ if(r.status==='untested'){ clean[r.origIndex]=String(r.book); worstUnable[r.origIndex]=true; } });
    const best =evaluateSample(sel.items, clean,     sel.interval, sel.confidence/100, {unable:S.unable||{}, anomaly:S.anomaly||{}, confirmedOver:conf});
    const worst=evaluateSample(sel.items, S.audited, sel.interval, sel.confidence/100, {unable:worstUnable, anomaly:S.anomaly||{}, confirmedOver:conf});
    return {best:best.uml, worst:worst.uml};
  },[sel,ev,S.audited,S.unable,S.anomaly]);

  if(!sel) return (
    <div className="card">
      <h2><span className="step-no">Step 3.</span> Evaluate &amp; project errors</h2>
      <div className="callout info">Draw a sample in Step 2 first, or open a previously saved sample or evaluation
        below — the selected items will appear here for you to enter audited values.</div>
      <FilesPanel S={S}/>
    </div>
  );

  const matDollar=parseFloat(String(S.materialityDollar).replace(/,/g,''))||0;
  const exceeds=ev.uml>matDollar;                       // conclusion = overstatement test
  const errItems=ev.rows.filter(r=>(r.status==='tested'||r.status==='unable') && Math.abs(r.misst)>1e-6);
  const basisNeg=sel.sampleBasis==='negative';
  const toGo=ev.counts.untested+ev.counts.pending;

  function setAud(idx,val){ S.set({audited:{...S.audited,[idx]:val}}); }
  function fillNoError(){
    const m={...S.audited};
    sel.items.forEach(it=>{
      const blank = m[it.origIndex]==null || String(m[it.origIndex]).trim()==='';
      if(blank && !(S.unable||{})[it.origIndex]) m[it.origIndex]=it.amount.toString();
    });
    S.set({audited:m});
  }
  function toggleUnable(oi){
    const u={...(S.unable||{})};
    if(u[oi]) delete u[oi]; else u[oi]=true;
    S.set({unable:u});
  }
  function confirmOver(oi){ S.set({confirmedOver:{...(S.confirmedOver||{}),[oi]:true}}); }
  function openAnom(oi){ setAnomJust(((S.anomaly||{})[oi]||{}).just||''); setAnomOpen(oi); }
  function saveAnom(){
    const a={...(S.anomaly||{})};
    a[anomOpen]={just:anomJust.trim(), by:S.username||'', at:new Date().toISOString()};
    S.set({anomaly:a}); setAnomOpen(null);
  }
  function removeAnom(){
    const a={...(S.anomaly||{})}; delete a[anomOpen];
    S.set({anomaly:a}); setAnomOpen(null);
  }
  function applyBulk(){
    const lines=(bulk.text||'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l!=='');
    const m={...S.audited}; let matched=0, skipped=0;
    if(bulk.mode==='ref'){
      const refIdx=new Map(sel.items.map(it=>[String(it.ref).trim().toLowerCase(), it.origIndex]));
      for(const ln of lines){
        const parts=ln.split(/[\t,]/).map(s=>s.trim()).filter(s=>s!=='');
        if(parts.length<2){ skipped++; continue; }
        const oi=refIdx.get(parts[0].toLowerCase());
        const v=parseAmount(parts[parts.length-1]);
        if(oi==null||isNaN(v)){ skipped++; continue; }
        m[oi]=String(v); matched++;
      }
    } else {
      for(let i=0;i<lines.length;i++){
        if(i>=sel.items.length){ skipped++; continue; }
        const v=parseAmount(lines[i]);
        if(isNaN(v)){ skipped++; continue; }
        m[sel.items[i].origIndex]=String(v); matched++;
      }
    }
    S.set({audited:m});
    setBulk({...bulk, result:'Applied '+matched+' value(s)'+(skipped?'; '+skipped+' line(s) skipped.':'.')});
  }
  async function exportEval(){
    const neg=sel.sampleBasis==='negative';
    const stName={tested:'Tested',untested:'Not yet tested',pending:'Awaiting >100% confirmation',unable:'Unable to test'};
    const rows=[
      ["Monetary Unit Sampling — evaluation"],
      ["Tool version",sel.toolVersion||TOOL_VERSION],
      ["Exported at",new Date().toLocaleString('en-AU')],
      ["Performed by",S.username||""],
      ["Sample basis",neg?"Negative values":"Positive values"],
      ["Confidence",sel.confidence+"%"],["Sampling interval",sel.interval.toFixed(2)],
      ["Random start",(sel.randomStart||0).toFixed(2)],
      ["Population fingerprint",sel.fingerprint? (sel.fingerprint.algo+" "+sel.fingerprint.hash):""],
      ["Tolerable misstatement / materiality",matDollar.toFixed(2)],
      ["Items — tested / unable / awaiting confirmation / untested",
        ev.counts.tested+" / "+ev.counts.unable+" / "+ev.counts.pending+" / "+ev.counts.untested],
      ["Most likely (net) error",ev.netMLE.toFixed(2)],
      ["Upper misstatement limit (overstatement)",ev.uml.toFixed(2)],
      ...(ev.anomalies.length? [["UML if anomalies treated as representative",ev.umlIncl.toFixed(2)]]:[]),
      ["Basic precision",ev.basicPrecision.toFixed(2)],
      ["Understatement — most likely (indicative only)",ev.mleUnder.toFixed(2)],
      ["Understatement — indicative lower limit (not reliable; MUS targets overstatement)",ev.lowerLimit.toFixed(2)],
      ["Conclusion", !ev.ready ? ("INCOMPLETE — "+toGo+" item(s) unresolved; conclusion withheld")
        : (exceeds?"UML exceeds tolerable misstatement":"UML within tolerable misstatement")],[""],
      ["Reference","Book value","Audited value","Status","Misstatement","Raw taint %","Taint used %","Projected","Type","Anomaly justification"]
    ];
    ev.rows.forEach(r=>rows.push([r.ref, r.book.toFixed(2),
      r.hasAud?r.audited.toFixed(2):"", stName[r.status]||r.status,
      (r.status==='tested'||r.status==='unable')?r.misst.toFixed(2):"",
      (r.status==='tested'||r.status==='unable')?(r.rawTaint*100).toFixed(2)+"%":"",
      (r.status==='tested'||r.status==='unable')?(r.taint*100).toFixed(2)+"%":"",
      (r.status==='tested'||r.status==='unable')?r.projected.toFixed(2):"",
      (r.isKey?"Key item":"Sample item")+(r.isAnomaly?" (anomaly — excluded from projection)":""),
      r.isAnomaly?(((S.anomaly||{})[r.origIndex]||{}).just||''):""]));
    rows.push([""]);
    rows.push(["Workings — Stringer bound (overstatement), so a reviewer can re-add the result"]);
    rows.push(["Reliability factors RF(0..n) at "+sel.confidence+"%", ev.rfList.map(x=>x.toFixed(2)).join(" | ")]);
    rows.push(["Component","Reference","Taint %","RF from","RF to","RF increment","$ contribution"]);
    rows.push(["Basic precision = RF(0) × interval","","","",ev.RF0.toFixed(2),"",ev.basicPrecision.toFixed(2)]);
    ev.overSchedule.forEach(s=>rows.push(["Ranked error "+s.rank, s.ref, (s.taint*100).toFixed(2)+"%",
      s.rfFrom.toFixed(2), s.rfTo.toFixed(2), s.inc.toFixed(2), s.contribution.toFixed(2)]));
    rows.push(["Key-item overstatements (actual, uncapped)","","","","","",ev.keyOver.toFixed(2)]);
    rows.push(["Total — upper misstatement limit","","","","","",ev.uml.toFixed(2)]);
    const res=await saveTextFile(baseName(S.username,sel.sampleBasis)+"-evaluation.csv", toCSV(rows), 'text/csv', '.csv', 'CSV file');
    setEvalMsg(res.cancelled ? 'Download cancelled.'
      : res.picked ? 'Evaluation CSV saved to the location you chose.'
      : 'Evaluation CSV downloaded to your computer.');
  }

  const stPill=(r)=>{
    if(r.status==='unable')  return <span className="pill st-wo" title="Treated as fully misstated (ASA 530.11)">Unable</span>;
    if(r.status==='pending') return <span className="pill st-bad" title="Entered value implies more than 100% misstatement — confirm it is not a typo">Confirm ›100%</span>;
    if(r.status==='untested')return <span className="pill st-mut">Untested</span>;
    if(r.isAnomaly)          return <span className="pill st-info" title="Excluded from projection (ASA 530.13)">Anomaly</span>;
    return <span className="pill st-ok">Tested</span>;
  };
  const view=ev.rows.map((r,i)=>({r,i}))
    .filter(({r})=> filter==='all' ? true
      : filter==='untested' ? (r.status==='untested'||r.status==='pending')
      : filter==='errors' ? ((r.status==='tested'||r.status==='unable') && Math.abs(r.misst)>1e-6)
      : (r.status==='pending'||r.status==='unable'||r.isAnomaly||r.capped))
    .filter(({r})=> !q.trim()||String(r.ref).toLowerCase().includes(q.trim().toLowerCase()));

  return (
    <div className="card">
      <h2><span className="step-no">Step 3.</span> Evaluate &amp; project errors</h2>
      <p className="sub">Enter the audited (correct) value beside each book value. Misstatements found in the
        sample are projected to the population.</p>
      {S.loadedName && <div className="note">Loaded: <b>{S.loadedName}</b>.</div>}

      {!ev.ready ? (
        <div className="banner hold">
          <span className="b-t">⏳ {toGo} of {sel.items.length} item(s) still to resolve</span>
          <span style={{flex:1}}>
            Enter audited values{ev.counts.pending>0? ', confirm the '+ev.counts.pending+' entr'+(ev.counts.pending===1?'y':'ies')+' over 100%':''},
            or mark items <b>U</b>nable to test. The conclusion is withheld until every item is resolved.
            {range && <span className="hint" style={{display:'block',marginTop:2}}>
              If the rest are clean: UML {money(range.best)} · if the rest are fully wrong: {money(range.worst)} (vs tolerable {money(matDollar)}).</span>}
          </span>
        </div>
      ) : (
        <div className={"banner "+(exceeds?'warn':'ok')}>
          <span className="b-t">{exceeds?'⚠ May exceed materiality':'✓ Within materiality'}</span>
          <span>Upper misstatement limit <b>{money(ev.uml)}</b> vs tolerable misstatement <b>{money(matDollar)}</b>
            {matDollar>0?<> ({pct(ev.uml/matDollar)})</>:null} · most likely error {money(ev.netMLE)}.</span>
        </div>
      )}

      <div className="row" style={{marginBottom:6}}>
        <button className="btn ghost sm" onClick={fillNoError}>Mark remaining "no error"</button>
        <button className="btn ghost sm" onClick={()=>setBulk({text:'',mode:'ref',result:null})}>Paste audited values…</button>
        <span className="hint"><b>{ev.counts.tested+ev.counts.unable}</b> of <b>{sel.items.length}</b> resolved
          {ev.counts.pending>0 && <> · <b style={{color:'var(--bad)'}}>{ev.counts.pending} to confirm</b></>}
          {ev.counts.unable>0 && <> · {ev.counts.unable} unable</>}</span>
        <span style={{flex:1}}/>
        <div className="seg" style={{maxWidth:360}}>
          {[['all','All'],['untested','Untested'],['errors','Errors'],['flags','Flagged']].map(([k,l])=>(
            <button key={k} className={filter===k?'on':''} onClick={()=>setFilter(k)}>{l}</button>))}
        </div>
        <input type="text" placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)}
          style={{maxWidth:150}} aria-label="Search sample items"/>
      </div>

      <div className="scrollx">
        <table className="data">
          <thead><tr>
            <th>#</th><th>Reference</th><th className="num">Book value</th><th className="num">Audited value</th>
            <th>Status</th><th className="num">Misstatement</th><th className="num">Tainting&nbsp;%</th>
            <th className="num">Projected</th><th>Type</th><th>Actions</th>
          </tr></thead>
          <tbody>
            {view.map(({r,i},vi)=>(
              <tr key={i} className={r.isKey?"key-row":""}>
                <td>{i+1}</td><td>{r.ref}</td>
                <td className="num">{money(r.book)}</td>
                <td className="num">
                  <input className={"inline-edit"+(r.status==='pending'?" cap":"")} type="number" placeholder="—"
                    aria-label={"Audited value for "+r.ref} data-aidx={vi} disabled={r.status==='unable'}
                    onKeyDown={e=>{ if(e.key==='Enter'){ const nx=document.querySelector('input[data-aidx="'+(vi+1)+'"]'); if(nx) nx.focus(); } }}
                    value={S.audited[r.origIndex]??''} onChange={e=>setAud(r.origIndex,e.target.value)}/>
                </td>
                <td>{stPill(r)}</td>
                <td className={"num "+((r.status==='tested'||r.status==='unable')?(r.misst>0?"miss-pos":r.misst<0?"miss-neg":""):"")}>
                  {(r.status==='tested'||r.status==='unable')?money(r.misst):'—'}</td>
                <td className="num">{(r.status!=='tested'&&r.status!=='unable')||r.isKey ? '—'
                  : (r.taint*100).toFixed(1)+'%'+(r.capped?' ⚠':'')}</td>
                <td className="num">{(r.status==='tested'||r.status==='unable')?money(r.projected):'—'}</td>
                <td><span className={"pill "+(r.isKey?"key":"smp")}>{r.isKey?"Key":"Sample"}</span></td>
                <td>
                  <div style={{display:'flex',gap:4}}>
                    {r.status==='pending' &&
                      <button className="rbtn confirm" onClick={()=>confirmOver(r.origIndex)}
                        title="Confirm this entry is correct (more than 100% misstated)">Confirm</button>}
                    <button className={"rbtn"+(r.status==='unable'?' on':'')} onClick={()=>toggleUnable(r.origIndex)}
                      title="Unable to test — treated as fully misstated (ASA 530.11)">U</button>
                    {((r.status==='tested' && Math.abs(r.misst)>1e-6) || r.isAnomaly) &&
                      <button className={"rbtn anom"+(r.isAnomaly?' on':'')} onClick={()=>openAnom(r.origIndex)}
                        title="Mark as an anomaly — excluded from projection, justification required (ASA 530.13)">A</button>}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {view.length===0 && <div className="note">No items match this filter.</div>}

      <h3>Projection to the population</h3>
      <div className="grid g2" style={{alignItems:'start'}}>
        <div style={{maxWidth:280}}>
          <label className="fld">Tolerable misstatement / materiality ($)<Q t="Your actual tolerable misstatement in dollars — normally set from financial-statement materiality, not from this population. The default is only a convenience."/></label>
          <NumText value={S.materialityDollar} ariaLabel="Tolerable misstatement"
            onChange={v=>{matTouched.current=true; S.set({materialityDollar:v});}}/>
          <div className="hint" style={{marginTop:5}}>Default = {sel.materiality}% × population book value
            = {money(sel.total*sel.materiality/100)}.</div>
        </div>
        <div className="statgrid" style={{gridTemplateColumns:'1fr 1fr'}}>
          <Stat k="Most likely error (net)" v={money(ev.netMLE)} tone="var(--navy)"/>
          <Stat k="Upper misstatement limit" big v={money(ev.uml)} tone={exceeds?'var(--warn)':'var(--ok)'}/>
          <Stat k="Basic precision" v={money(ev.basicPrecision)}/>
        </div>
      </div>

      {ev.ready ? (
        <div className={"callout "+(exceeds?"warn":"ok")}>
          <div className="ttl">{exceeds
            ? "⚠ Projected misstatement may exceed materiality"
            : "✓ Within materiality"}</div>
          <div>Overstatement upper limit <b>{money(ev.uml)}</b> is {exceeds?"above":"below"} tolerable
            misstatement <b>{money(matDollar)}</b>{matDollar>0?<> ({pct(ev.uml/matDollar)} of materiality)</>:null}.</div>
          <div style={{marginTop:6}}>{exceeds
            ? "The population may be materially misstated — propose adjustments, extend the sample, or investigate further."
            : "Based on this sample there is no evidence the population is materially misstated at the chosen confidence level."}</div>
          {ev.counts.unable>0 && <div style={{marginTop:6,fontSize:12.5}}>{ev.counts.unable} item(s) could not be
            tested and are treated as fully misstated (ASA 530.11).</div>}
          {ev.excessOver>0 && <div style={{marginTop:6,fontSize:12.5,fontWeight:600}}>Note: sampled item(s) were misstated
            by more than their book value — the excess of {money(ev.excessOver)} is beyond what MUS can project;
            consider treating those items as individually significant or extending testing.</div>}
          {ev.anomalies.length>0 && <div style={{marginTop:6,fontSize:12.5}}>
            <b>Anomal{ev.anomalies.length===1?'y':'ies'} excluded from projection:</b> {ev.anomalies.map(a=>a.ref+' ('+money(a.misst)+')').join(', ')}.
            {' '}UML if treated as representative: <b>{money(ev.umlIncl)}</b>; as anomaly: <b>{money(ev.uml)}</b>.
            {ev.anomalies.length===1
              ? ' The actual error still counts as a misstatement and is carried to the schedule.'
              : ' The actual errors still count as misstatements and are carried to the schedule.'}
            {ev.anomalies.length>1 && <b style={{color:'var(--bad)'}}> More than one anomaly is contradictory — anomalies
            are by definition extremely rare (ASA 530.13).</b>}</div>}
        </div>
      ) : (
        <div className="note"><b>Conclusion withheld.</b> {toGo} selected item(s) are not yet resolved. Under
          ASA 530.11 an item you cannot test is treated as <i>misstated</i>, not clean — so the tool will not
          conclude while items are blank. Enter audited values, or use <b>U</b> for items that genuinely cannot
          be tested.</div>
      )}

      {ev.mleUnder>1e-6 && (
        <div className="callout" style={{background:'var(--warn-o-bg)',borderColor:'var(--warn-o-stroke)'}}>
          <div className="ttl" style={{color:'var(--warn-o)'}}>Understatements were found — read this before relying on them</div>
          <div>Most likely understatement <b>{money(ev.mleUnder)}</b>. MUS is built to catch <b>over</b>statement —
            understated items are small precisely <i>because</i> they are understated, so this sample cannot reliably
            measure how much understatement exists. Treat this figure as a signal only, and plan a separate
            completeness-directed test (for example a search for unrecorded liabilities or a subsequent-payments
            review). An indicative figure is included in the CSV export for the record.</div>
        </div>
      )}

      <div className="row no-print">
        <button className="btn ghost" onClick={exportEval}>Download evaluation (CSV)</button>
        <button className="btn ghost" onClick={()=>window.print()}>Print working paper</button>
        {evalMsg && <span className="hint">{evalMsg}</span>}
      </div>

      {bulk && (
        <Dlg title="Paste audited values" onClose={()=>setBulk(null)} wide
          foot={<><button className="btn sm" onClick={()=>setBulk(null)}>Close</button>
            <button className="btn primary sm" onClick={applyBulk} disabled={!bulk.text.trim()}>Apply</button></>}>
          <div className="hint" style={{marginBottom:6}}>Paste straight from Excel — either <b>two columns</b>
            (reference, audited value) matched by reference, or a <b>single column</b> of values in the same order
            as the selected sample ({sel.items.length} items).</div>
          <div className="seg" style={{maxWidth:340,marginBottom:8}}>
            <button className={bulk.mode==='ref'?'on':''} onClick={()=>setBulk({...bulk,mode:'ref'})}>Match by reference</button>
            <button className={bulk.mode==='order'?'on':''} onClick={()=>setBulk({...bulk,mode:'order'})}>By row order</button>
          </div>
          <textarea style={{minHeight:160,width:'100%'}} value={bulk.text} autoFocus
            placeholder={bulk.mode==='ref'?"INV-1001\t4820.55\nINV-1002\t92140.00":"4820.55\n92140.00\n…"}
            onChange={e=>{ const t=e.target.value;
              const first=(t.split(/\r?\n/).find(l=>l.trim())||'');
              const twoCol=first.split(/[\t,]/).filter(s=>s.trim()!=='').length>=2;
              setBulk({...bulk, text:t, mode: t===''?bulk.mode:(twoCol?'ref':'order')}); }}/>
          {bulk.result && <div className="note" style={{marginTop:8}}>{bulk.result}</div>}
        </Dlg>
      )}

      {anomOpen!=null && (
        <Dlg title={"Mark "+((sel.items.find(x=>x.origIndex===anomOpen)||{}).ref||'item')+" as an anomaly"}
          onClose={()=>setAnomOpen(null)}
          foot={<>
            {(S.anomaly||{})[anomOpen] && <button className="btn danger sm" onClick={removeAnom}>Remove anomaly</button>}
            <button className="btn sm" onClick={()=>setAnomOpen(null)}>Cancel</button>
            <button className="btn primary sm" onClick={saveAnom} disabled={anomJust.trim().length<10}>Save</button></>}>
          <div className="hint" style={{marginBottom:8}}>ASA 530.13: an anomaly is a misstatement <b>demonstrably not
            representative</b> of the population. You must obtain a <b>high degree of certainty</b> through additional
            procedures before excluding it from the projection — and its actual dollar error still counts as a
            misstatement. Record what makes it non-representative and the extra work performed:</div>
          <textarea style={{minHeight:110,width:'100%'}} value={anomJust} autoFocus
            placeholder="e.g. One-off system conversion error on 3 July; IT confirmed the defect affected only this batch; all 14 affected invoices identified and tested separately with no further errors."
            onChange={e=>setAnomJust(e.target.value)}/>
          <div className="hint" style={{marginTop:4}}>{anomJust.trim().length<10?'Justification required (at least a sentence).':'Will record: '+(S.username||'[name not set]')+', today.'}</div>
        </Dlg>
      )}

      <details className="method"><summary>Projection methodology (Stringer bound)</summary>
        <div>
          For each <b>sample item</b> (book value &lt; interval) the <b>tainting</b> =
          <code>(book − audited) ÷ book</code>, capped at ±100% <i>for the projection maths only</i> (the Stringer
          method requires taints between −100% and +100%; any excess over book value is reported separately), and the
          <b> projected misstatement</b> = <code>tainting × interval</code>.
          <b> Key items</b> (book value ≥ interval) are examined in full, so their <b>actual misstatement is used
          uncapped</b> — no projection is involved. Items that <b>cannot be tested</b> are treated as fully misstated
          (ASA 530.11), and <b>anomalies</b> are excluded from the projection but still counted as actual misstatements
          (ASA 530.13). The <b>most likely error</b> is the sum of projected misstatements.<br/><br/>
          The <b>upper misstatement limit</b> adds an allowance for sampling risk using the Stringer bound:
          <code>UML = interval × [ R(0) + Σ taintᵢ × (R(i) − R(i−1)) ] + key-item misstatements</code>,
          where taints are ranked largest first and <code>R(k)</code> is the Poisson reliability factor for
          <code>k</code> overstatements at {sel.confidence}% confidence (<code>R(0) = {ev.RF0.toFixed(2)}</code>).
          Overstatements and understatements are evaluated separately. Compare the UML with materiality to conclude.
        </div>
      </details>

      <h3>Example documentation — projection of errors <span className="hint" style={{textTransform:'none',letterSpacing:0}}>· updates as you enter results</span></h3>
      <div className="wp">
        <div className="lbl">Working-paper note — supplies &amp; services expenses</div>
        <p><b>Test:</b> {sel.items.length} invoices for supplies and services ({basisNeg?'credit/negative':'positive'} items) tested for {basisNeg?'misstatement':'overstatement'} by agreeing each invoice to supporting records.</p>
        <p><b>Misstatements found:</b> {errItems.length===0
          ? 'none — audited values agreed to recorded values.'
          : errItems.length+' ('+errItems.slice(0,6).map(e=>e.ref).join(', ')+(errItems.length>6?', …':'')+').'}</p>
        <p><b>Projection:</b> most likely error {money(ev.netMLE)}; basic precision {money(ev.basicPrecision)}; upper misstatement limit <b>{money(ev.uml)}</b> at {sel.confidence}% confidence.</p>
        <p><b>Conclusion:</b> {!ev.ready
          ? '[conclusion withheld — '+toGo+' selected item(s) not yet resolved]'
          : exceeds
          ? 'the upper misstatement limit exceeds tolerable misstatement ('+money(matDollar)+'), so the population may be materially misstated — request management to investigate and correct, and consider extending the sample.'
          : 'the upper misstatement limit ('+money(ev.uml)+') is below tolerable misstatement ('+money(matDollar)+'), so there is no evidence the population is materially misstated for '+(basisNeg?'misstatement':'overstatement')+'.'}</p>
        {ev.counts.unable>0 && <p>{ev.counts.unable} item(s) could not be tested and were treated as fully misstated (ASA 530.11).</p>}
        {ev.anomalies.length>0 && <p>{ev.anomalies.length} misstatement(s) treated as anomalies under ASA 530.13 (justification retained); their actual errors remain in the schedule of misstatements.</p>}
        <p>{Math.abs(ev.netMLE)>1e-6? 'The most likely error of '+money(ev.netMLE)+' was carried to the schedule of misstatements. ' : ''}Performed by {S.username||'[initials]'} on {new Date().toLocaleDateString('en-AU')}.</p>
        <p className="ref">Ref: ASA 530 para 12–15; ASA 450 (evaluation of misstatements).</p>
      </div>

      <FilesPanel S={S}/>

      <div className="row no-print" style={{marginTop:16}}>
        <button className="btn" onClick={()=>S.set({step:2})}>&larr; Select sample</button>
      </div>
    </div>
  );
}

/* ---------------- Files — one place to save, open and manage samples ---------------- */
function FilesPanel({S, pop}){
  const [name,setName]=useState(S.loadedName||"");
  const [nameEdited,setNameEdited]=useState(!!S.loadedName);
  const [msg,setMsg]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);   // rec pending delete
  const [repTarget,setRepTarget]=useState('');
  const [repResult,setRepResult]=useState(null);
  const fileRef=useRef();
  const canSave=!!S.selection;

  // keep the name defaulted to username_ddmmyy_HHMM_basis until the user types their own
  useEffect(()=>{ if(S.selection && !nameEdited) setName(S.defaultSampleName());
  // eslint-disable-next-line
  },[S.selection]);

  async function doSave(){
    const r=S.saveCurrentSample(name.trim());
    if(!r.rec){ setMsg({t:'err',m:r.msg||'Could not save to this browser.'}); return; }
    const res=await saveTextFile(safeFileName(r.name)+'.csv', toCSV(sampleRecToCSV(r.rec)), 'text/csv', '.csv', 'CSV file');
    const browserPart = r.ok ? ((r.replaced?'Updated “':'Saved “')+r.name+'” to this browser') : (r.msg||'Browser save failed');
    const filePart = res.cancelled ? '; CSV not saved (cancelled).'
      : res.picked ? ' and saved a CSV to the location you chose.'
      : ' and downloaded a CSV copy to your computer.';
    setMsg({t: r.ok?'ok':'err', m: browserPart + filePart});
  }
  // one Open button — detects what kind of file it is
  function doOpen(e){
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const text=String(rd.result||'');
      const head=text.slice(0,200);
      let r;
      if(/^\s*[\[{]/.test(text)){                      // legacy JSON export
        r=S.importSavedSample(text);
        setMsg(r.ok?{t:'ok',m:'Imported '+r.count+' sample(s) from JSON.'}:{t:'err',m:r.msg});
      } else if(/—\s*evaluation/.test(head)){          // evaluation CSV → open in Evaluate
        r=S.loadEvaluationCSV(text, f.name);
        setMsg(r.ok?{t:'ok',m:'Opened evaluation “'+r.name+'” on the Evaluate step.'}:{t:'err',m:r.msg});
      } else {                                          // saved/selected sample CSV → add to list and open
        r=S.importSavedSampleCSV(text);
        if(r.ok && r.rec){ S.loadSavedSample(r.rec); setMsg({t:'ok',m:'Imported and opened “'+r.name+'”.'}); }
        else setMsg({t:'err',m:r.msg||'Could not read that file.'});
      }
    };
    rd.readAsText(f); e.target.value='';
  }
  function exportRec(rec){
    saveTextFile(safeFileName(rec.name)+'.csv', toCSV(sampleRecToCSV(rec)), 'text/csv', '.csv', 'CSV file');
  }
  // Reperform check: re-run the selection on the CURRENT population with a saved
  // sample's parameters and diff the selected references (Step 2 only)
  function runReperform(){
    const rec=S.savedSamples.find(x=>x.id===repTarget);
    if(!rec||!pop||pop.count===0) return;
    const sel2=runSelection(pop.items, rec.interval, rec.randomStart);
    const now=new Set(sel2.map(i=>String(i.ref).trim()));
    const then=new Set((rec.items||[]).map(i=>String(i.ref).trim()));
    const missing=[...then].filter(x=>!now.has(x));
    const extra=[...now].filter(x=>!then.has(x));
    const fpNow=S.fingerprint? S.fingerprint.hash:'', fpThen=rec.fingerprint? rec.fingerprint.hash:'';
    setRepResult({ match: missing.length===0 && extra.length===0,
      nowCount:sel2.length, thenCount:(rec.items||[]).length, missing, extra,
      fpMatch: fpNow && fpThen ? (fpNow===fpThen) : null, recName:rec.name,
      sortNote: (typeof rec.sortedByRef==='boolean' && !!S.sortByRef!==rec.sortedByRef)
        ? 'Sort setting differs — saved sample was '+(rec.sortedByRef?'sorted by reference':'in file order')+'.' : null });
  }

  const list=S.savedSamples;
  return (
    <>
      <h3>Files <span className="hint" style={{textTransform:'none',letterSpacing:0}}>· save, open and manage samples</span></h3>
      <div className="savebar">
        <input type="text" aria-label="Sample name"
          placeholder={canSave?"Name this sample…":"Draw or open a sample first"}
          value={name} onChange={e=>{setName(e.target.value); setNameEdited(e.target.value.trim()!=='');}}
          disabled={!canSave} style={{flex:'1 1 240px',maxWidth:320}}/>
        <button className="btn teal sm" onClick={doSave} disabled={!canSave}>Save current sample</button>
        <button className="btn ghost sm" onClick={()=>fileRef.current.click()}>Open file…</button>
