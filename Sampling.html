        <input ref={fileRef} type="file" accept=".csv,.json,text/csv,application/json" style={{display:'none'}} onChange={doOpen}/>
        <span className="hint">Save writes to this browser <b>and</b> a CSV file. Open reads a saved sample or a
          downloaded evaluation — the type is detected automatically.</span>
      </div>
      {msg && <div className={msg.t==='ok'?'note':'err'} style={{marginTop:8}}>{msg.m}</div>}

      {list.length>0 && (
        <div className="scrollx" style={{maxHeight:300,marginTop:10}}>
          <table className="data">
            <thead><tr><th>Name</th><th>Saved</th><th className="num">Items</th>
              <th className="num">Interval</th><th>Parameters</th><th>Actions</th></tr></thead>
            <tbody>
              {list.map(r=>(
                <tr key={r.id}>
                  <td><b>{r.name}</b></td>
                  <td>{r.savedAt? new Date(r.savedAt).toLocaleString('en-AU') : '—'}</td>
                  <td className="num">{r.items?r.items.length:0}</td>
                  <td className="num">{money(r.interval)}</td>
                  <td>{r.ee} EE · {r.confidence}% · {r.materiality}% · {r.sampleBasis==='negative'?'neg':'pos'}</td>
                  <td>
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn primary sm" onClick={()=>S.loadSavedSample(r)}>Load</button>
                      <button className="btn ghost sm" onClick={()=>exportRec(r)}>Export CSV</button>
                      <button className="btn ghost sm" onClick={()=>setConfirmDel(r)}>Delete</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {list.length===0 && <div className="note" style={{marginTop:8}}>Nothing saved in this browser yet — draw a
        sample and click <b>Save current sample</b>, or <b>Open</b> a previously saved CSV.</div>}

      {pop && pop.count>0 && list.length>0 && (
        <div className="savebar" style={{marginTop:10}}>
          <span style={{fontWeight:600,fontSize:12.5}}>Reperform check<Q t="Re-runs the selection on the population loaded above using a saved sample's interval and random start, and compares the selected references item by item. A match proves the sample re-performs; a mismatch means the population, its order, or the parameters changed."/></span>
          <select value={repTarget} onChange={e=>{setRepTarget(e.target.value); setRepResult(null);}} style={{maxWidth:280}}>
            <option value="">— choose a saved sample —</option>
            {list.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}
          </select>
          <button className="btn ghost sm" onClick={runReperform} disabled={!repTarget}>Run check</button>
        </div>
      )}
      {repResult && (
        <div className={repResult.match?'note':'err'} style={{marginTop:8}}>
          {repResult.match
            ? <><b>✓ Match.</b> Re-running the selection reproduced all {num0(repResult.thenCount)} item(s) of “{repResult.recName}”.
              {repResult.fpMatch===true && ' Population fingerprint also matches.'}
              {repResult.fpMatch===false && ' Note: the population fingerprint differs — same selections, but the file is not identical.'}</>
            : <><b>✗ Mismatch.</b> Re-running selects {num0(repResult.nowCount)} item(s) vs {num0(repResult.thenCount)} saved.
              {repResult.fpMatch===false && ' The population fingerprint differs — this is not the same file/population.'}
              {repResult.sortNote && ' '+repResult.sortNote}
              {repResult.missing.length>0 && <> Missing: {repResult.missing.slice(0,8).join(', ')}{repResult.missing.length>8?'…':''}.</>}
              {repResult.extra.length>0 && <> Extra: {repResult.extra.slice(0,8).join(', ')}{repResult.extra.length>8?'…':''}.</>}</>}
        </div>
      )}

      {confirmDel && (
        <ConfirmDlg title="Delete saved sample?"
          body={<>Delete “<b>{confirmDel.name}</b>” from this browser? Any exported CSV copies are unaffected.</>}
          confirmLabel="Delete"
          onConfirm={()=>{ S.deleteSavedSample(confirmDel.id); setConfirmDel(null); }}
          onCancel={()=>setConfirmDel(null)}/>
      )}
    </>
  );
}

/* ---------------- Documentation guidance (ASA) ---------------- */
function AsaRef({children}){ return <span className="asa">{children}</span>; }
function StepDocs({S}){
  const sel=S.selection;
  const ev = sel ? evaluateSample(sel.items, S.audited, sel.interval, sel.confidence/100,
    {unable:S.unable||{}, anomaly:S.anomaly||{}, confirmedOver:S.confirmedOver||{}}) : null;
  const matDollar = parseFloat(String(S.materialityDollar).replace(/,/g,''))||(sel? sel.total*sel.materiality/100:0);
  const exceeds = ev? ev.uml>matDollar : false;
  const fp = (sel&&sel.fingerprint)||S.fingerprint;
  const today=new Date().toLocaleDateString('en-AU');
  return (
    <div className="card docs">
      <h2><span className="step-no">Documentation.</span> Evidencing your MUS work under the Australian Auditing Standards</h2>
      <p className="sub">What to record so your MUS work meets the AUASB standards. Paragraph references are to the
        compiled standards — confirm against the current versions and apply your office methodology.</p>

      <div className="callout info">
        <div className="ttl">The standards that apply</div>
        <ul>
          <li><b><AsaRef>ASA 530</AsaRef> Audit Sampling</b> — design/size/select (para 6–8), perform (9–11),
            misstatements (12–13), project (14), evaluate (15); MUS is value-weighted selection (Appendix 1 &amp; 4).</li>
          <li><b><AsaRef>ASA 230</AsaRef> Audit Documentation</b> — an experienced auditor with no prior connection
            should understand the work, results and judgements (para 8); record what was tested, and who did and
            reviewed it and when (para 9).</li>
          <li><b><AsaRef>ASA 320</AsaRef> Materiality</b> &amp; <b><AsaRef>ASA 450</AsaRef> Evaluation of Misstatements</b> —
            set tolerable misstatement; accumulate and evaluate misstatements against materiality.</li>
          <li><b><AsaRef>ASA 330</AsaRef></b> / <b><AsaRef>ASA 500</AsaRef></b> — a substantive procedure that gives
            sufficient appropriate audit evidence.</li>
        </ul>
      </div>

      <h3 style={{fontSize:12}}>Part A — what to record</h3>
      <div className="callout info">
        <div className="ttl">Worked example on every step</div>
        <div>Steps 1–3 each show a live <b>working-paper note</b> for a supplies-and-services DST that fills in with
          your actual figures — copy it straight onto the file. The <b>Record</b> lists below set out what each note
          should cover, and <b>Part B</b> assembles them into one model workpaper from your current session.</div>
      </div>

      <h3>(a) Documenting the sample-size estimate</h3>
      <p><b>Record</b> (<AsaRef>ASA 530</AsaRef> para 6–7; <AsaRef>ASA 320</AsaRef>; <AsaRef>ASA 230</AsaRef> para 8):</p>
      <ul className="rec">
        <li>the population and assertion, and that the population is complete (ties to the ledger);</li>
        <li>why MUS, and the parameters with your reasons — expected error, confidence, materiality;</li>
        <li>the resulting sample size and its source (this tool's tables);</li>
        <li>how key items and any excluded items are handled.</li>
      </ul>

      <h3>(b) Documenting the sample selection — the tool used and how it selects</h3>
      <p><b>Record</b> (<AsaRef>ASA 530</AsaRef> para 8 &amp; Appendix 1/4; <AsaRef>ASA 230</AsaRef> para 9):</p>
      <ul className="rec">
        <li>the tool (and version/date) and the method — fixed-interval MUS (probability-proportional-to-size);</li>
        <li>the inputs that fix the selection: amount column, sample basis (positive/negative), population value and
          count, interval, and random start;</li>
        <li>that key items (≥ the interval) are examined in full;</li>
        <li>that the selection re-performs from population order + interval + random start — attach the exported/saved
          sample as the record of items tested;</li>
        <li>who selected it and when.</li>
      </ul>

      <h3>(c) Documenting the projection (extrapolation) of errors to the population</h3>
      <p><b>Record</b> (<AsaRef>ASA 530</AsaRef> para 12–15; <AsaRef>ASA 450</AsaRef>):</p>
      <ul className="rec">
        <li>each item's book value, audited value, misstatement and cause; flag any anomaly;</li>
        <li>the projection — sample items = tainting × interval, key items = actual — giving the most likely error;</li>
        <li>the upper misstatement limit (Stringer bound), basic precision and confidence used;</li>
        <li>the conclusion vs materiality and your response; carry misstatements to the misstatements schedule.</li>
      </ul>

      <h3 style={{fontSize:12}}>Part B — a model workpaper, built live from your current session</h3>
      <div className="row no-print" style={{margin:'6px 0'}}>
        <span className="hint">Fills in as you work through Steps 1–3 — print it or copy it onto the audit file.</span>
        <button className="btn ghost sm" onClick={()=>window.print()}>Print working paper</button>
      </div>
      <div className="wp">
        <div className="lbl">Working paper — Monetary Unit Sampling · detailed substantive testing</div>
        <p><b>Entity / account:</b> [entity] — [account, e.g. supplies &amp; services expenses], year ended [date].
          &nbsp;<b>Assertion:</b> occurrence and accuracy ({(sel&&sel.sampleBasis==='negative')?'misstatement of credit items':'overstatement'}).</p>
        <p><b>Method &amp; tool:</b> two-stratum Monetary Unit Sampling — individually significant items examined in
          full, remainder by systematic probability-proportional-to-size selection. MUS tool
          v{(sel&&sel.toolVersion)||TOOL_VERSION}; calculations run locally in the browser.</p>
        <p><b>Population:</b> {sel? <>{num0(sel.popCount)} items totalling {money(sel.total)} ({sel.sampleBasis==='negative'?'negative':'positive'} values,
            amount column “{sel.amountColName||'—'}”, references “{sel.refColName||'—'}”,
            {sel.sortedByRef?' sorted by reference':' in file order'}).
            Exclusions — totals rows: {sel.exclusions?sel.exclusions.totals:0}; wrong sign/zero: {sel.exclusions?sel.exclusions.wrongSign:0};
            unparsed: {sel.exclusions?sel.exclusions.unparsed:0} (tested separately).</>
          : <span className="muted">[load the population on the Select step]</span>}
          {' '}Completeness: agreed to [GL / trial balance ref].</p>
        <p><b>Population fingerprint:</b> {fp? <>{fp.algo} <span style={{fontFamily:'var(--mono)',fontSize:11}}>{fp.hash}</span>{fp.rows!=null && <> · {num0(fp.rows)} rows · {money(fp.total)}</>}</> : <span className="muted">[computed when a population is loaded]</span>}</p>
        <p><b>Parameters &amp; judgement:</b> {S.ee.toLowerCase()} expected error; {S.confidence}% confidence
          (sampling risk {100-S.confidence}%); materiality {S.materiality}% of population
          {sel? <> — tolerable misstatement {money(matDollar)}</> : null}. Sample size per the DST table:
          {' '}<b>{SAMPLE_TABLES[S.ee][S.confidence][S.materiality]}</b>.</p>
        <p><b>Selection:</b> {sel? <>{num0(sel.items.length)} items selected on {sel.runAt? new Date(sel.runAt).toLocaleDateString('en-AU'):'[date]'} —
            {' '}{num0(sel.items.filter(i=>i.isKey).length)} key item(s) ≥ the interval (examined in full,
            {' '}{money(sel.keyValue||sel.items.filter(i=>i.isKey).reduce((s,x)=>s+x.amount,0))}) and
            {' '}{num0(sel.items.filter(i=>!i.isKey).length)} MUS selections. Interval {money(sel.interval)};
            random start {sel.randomStart>0?money(sel.randomStart):'[not recorded]'}. The exported selection CSV is
            filed at [WP ref].</>
          : <span className="muted">[draw the sample on the Select step]</span>}</p>
        <p><b>Testing &amp; results:</b> {ev? <>{ev.counts.tested+ev.counts.unable} of {sel.items.length} items resolved
            ({ev.counts.unable} unable to test — treated as fully misstated per ASA 530.11;
            {' '}{ev.anomalies.length} anomal{ev.anomalies.length===1?'y':'ies'} per ASA 530.13).
            Misstatements found: {ev.rows.filter(r=>(r.status==='tested'||r.status==='unable')&&Math.abs(r.misst)>1e-6).length}.
            Most likely error {money(ev.netMLE)}; basic precision {money(ev.basicPrecision)};
            upper misstatement limit <b>{money(ev.uml)}</b> at {sel.confidence}% confidence
            {ev.anomalies.length>0 && <> (UML if anomalies treated as representative: {money(ev.umlIncl)})</>}.
            {ev.mleUnder>1e-6 && <> Understatements of {money(ev.mleUnder)} (most likely) were noted — MUS cannot
            reliably measure understatement; a separate completeness test is planned at [WP ref].</>}</>
          : <span className="muted">[enter audited values on the Evaluate step]</span>}</p>
        <p><b>Conclusion:</b> {ev? (!ev.ready
            ? <span className="muted">[withheld — {ev.counts.untested+ev.counts.pending} item(s) unresolved]</span>
            : exceeds
            ? <>the upper misstatement limit exceeds tolerable misstatement ({money(matDollar)}) — the population may be
              materially misstated; adjustments proposed / testing extended as documented at [WP ref].</>
            : <>the upper misstatement limit ({money(ev.uml)}) is below tolerable misstatement ({money(matDollar)});
              no evidence the population is materially misstated. Errors found were carried to the schedule of
              misstatements.</>)
          : <span className="muted">[complete the evaluation]</span>}</p>
        <p><b>Performed by:</b> {S.username||'[name]'} on {today}. <b>Reviewed by:</b> [name / date].</p>
        <p className="ref">Ref: ASA 530 para 6–15; ASA 230 para 8–9; ASA 320; ASA 450. Tool {TOOL_VERSION}.</p>
      </div>

      <h3 style={{fontSize:12}}>Part C — reperforming the selection</h3>
      <p>A reviewer must be able to re-run your selection and land on the identical items. The selection is fully
        determined by three things — <b>the population and its order, the sampling interval, and the random start</b> —
        so reperformance is guaranteed if those are evidenced:</p>
      <ul className="rec">
        <li><b>Keep the source file</b> and record its <b>fingerprint</b> (the tool computes one — row count, total and
          a checksum — and writes it into every export). A matching fingerprint proves "same population"; a claim isn't proof.</li>
        <li><b>Pin down the order</b> — tick <i>Sort by reference before selecting</i> so the order is reconstructable
          from the data itself, or record that file order was used.</li>
        <li><b>Record the settings</b> — the exported selection CSV carries the amount/reference columns, header and
          sort settings, exclusions, interval, random start, date and the tool version.</li>
        <li><b>Keep the exports</b> — the selection CSV is the record of items tested; the evaluation CSV shows the
          ranked-taint workings so the Stringer bound can be re-added with a calculator.</li>
      </ul>
      <div className="callout info">
        <div className="ttl">To reperform</div>
        <div>Open the retained source file on the Select step → apply the same sort setting → enter the recorded
          interval and random start → <b>Draw sample</b> → agree the selected references to the retained selection CSV.
          Or use the one-click <b>Reperform check</b> in the Files panel on the Select step — it re-runs the selection
          with a saved sample's parameters and reports match or mismatch item by item (and compares fingerprints).
          Any difference means the population, its order, or a parameter changed. The random start is the only random
          element — identical inputs must reproduce the identical sample.</div>
      </div>

      <div className="note"><b>Disclaimer.</b> This is general guidance to help structure your documentation; it is not a
        substitute for the standards themselves or your office's methodology. Refer to the current Australian Auditing
        Standards issued by the AUASB (auasb.gov.au) and exercise professional judgement.</div>
    </div>
  );
}

/* ---------------- App ---------------- */
const DEFAULT_ST={
  step:1, ee:"Low", confidence:95, materiality:5,
  sampleSize:SAMPLE_TABLES.Low[95][5],
  rawData:"", hasHeader:true, amountCol:0, refCol:0,
  interval:"", intervalTouched:false, randomStart:"", sampleBasis:"positive", sortByRef:false,
  selection:null, audited:{}, unable:{}, confirmedOver:{}, anomaly:{},
  materialityDollar:"", loadedName:"", fingerprint:null
};
function App(){
  // restore the previous session (auto-saved below) so a refresh loses nothing
  const [st,setSt]=useState(()=>{
    try{
      const raw=window.localStorage.getItem(SESSION_KEY);
      if(raw){ const s=JSON.parse(raw); if(s && typeof s==='object') return {...DEFAULT_ST, ...s}; }
    }catch(e){}
    return DEFAULT_ST;
  });
  const set=(patch)=>setSt(s=>({...s,...patch}));

  // ---- auto-save the session to this browser on every change ----
  const persistFailed=useRef(false);
  useEffect(()=>{
    try{
      window.localStorage.setItem(SESSION_KEY, JSON.stringify(st));
      persistFailed.current=false;
    }catch(e){
      // quota — retry without the (possibly huge) raw population text
      try{ const {rawData, ...rest}=st;
        window.localStorage.setItem(SESSION_KEY, JSON.stringify(rest));
        persistFailed.current=false;
      }catch(e2){ persistFailed.current=true; }
    }
  },[st]);
  // warn on close only when auto-save is not working and there is real work in flight
  useEffect(()=>{
    const h=(e)=>{ if(persistFailed.current && (st.selection||st.rawData)){ e.preventDefault(); e.returnValue=''; } };
    window.addEventListener('beforeunload',h);
    return ()=>window.removeEventListener('beforeunload',h);
  },[st.selection,st.rawData]);
  function resetSession(){
    try{ window.localStorage.removeItem(SESSION_KEY); }catch(e){}
    setSt(DEFAULT_ST);
  }

  // performed-by / username (persisted) — used in default file names and working papers
  const [username,setUsernameState]=useState(()=>{ try{return window.localStorage.getItem('mus_username')||'';}catch(e){return '';} });
  function setUsername(v){ setUsernameState(v); try{window.localStorage.setItem('mus_username',v);}catch(e){} }

  // ---- saved samples (persist to browser localStorage) ----
  const [savedSamples,setSavedSamples]=useState(()=>loadSavedSamples());
  function persist(list){ setSavedSamples(list); return writeSavedSamples(list); }
  function saveCurrentSample(rawName){
    const sel=st.selection; if(!sel) return {ok:false,msg:'Draw a sample first.'};
    const name=(rawName&&rawName.trim())||baseName(username,sel.sampleBasis);
    const rec={ id:makeId(), name, savedAt:new Date().toISOString(), performedBy:username||"",
      toolVersion:sel.toolVersion||TOOL_VERSION, runAt:sel.runAt||"",
      amountColName:sel.amountColName||"", refColName:sel.refColName||"",
      hasHeader:sel.hasHeader!==false, sortedByRef:!!sel.sortedByRef,
      exclusions:sel.exclusions||null, fingerprint:sel.fingerprint||null,
      ee:sel.ee, confidence:sel.confidence, materiality:sel.materiality, sampleBasis:sel.sampleBasis||'positive',
      total:sel.total, popCount:sel.popCount, sampleSize:sel.sampleSize,
      interval:sel.interval, randomStart:sel.randomStart,
      materialityDollar:st.materialityDollar, audited:st.audited||{},
      unable:st.unable||{}, confirmedOver:st.confirmedOver||{}, anomaly:st.anomaly||{},
      items:sel.items.map(it=>({ref:it.ref,amount:it.amount,signed:it.signed,origIndex:it.origIndex,
        cumStart:it.cumStart,cumEnd:it.cumEnd,isKey:it.isKey,nHits:it.nHits})) };
    const list=[...savedSamples];
    const i=list.findIndex(x=>(x.name||'').toLowerCase()===name.toLowerCase());
    let replaced=false;
    if(i>=0){ rec.id=list[i].id; list[i]=rec; replaced=true; } else list.unshift(rec);
    const ok=persist(list);
    return {ok, replaced, name, rec, msg: ok?'':'This browser blocked local storage — the downloaded file copy is your record.'};
  }
  function deleteSavedSample(id){ persist(savedSamples.filter(x=>x.id!==id)); }
  function loadSavedSample(rec){
    const selection={ items:rec.items||[], interval:rec.interval, randomStart:rec.randomStart,
      sampleSize:rec.sampleSize, total:rec.total, popCount:rec.popCount,
      ee:rec.ee, confidence:rec.confidence, materiality:rec.materiality, sampleBasis:rec.sampleBasis||'positive',
      amountColName:rec.amountColName||'', refColName:rec.refColName||'',
      hasHeader:rec.hasHeader!==false, sortedByRef:!!rec.sortedByRef,
      exclusions:rec.exclusions||null, fingerprint:rec.fingerprint||null,
      runAt:rec.runAt||'', toolVersion:rec.toolVersion||'' };
    set({ selection, audited:rec.audited||{}, unable:rec.unable||{}, confirmedOver:rec.confirmedOver||{},
      anomaly:rec.anomaly||{}, materialityDollar:rec.materialityDollar||'',
      loadedName:rec.name, step:3, sampleBasis:rec.sampleBasis||'positive' });
  }
  function exportSavedSample(rec){
    downloadCSV(safeFileName(rec.name||'sample')+'.csv', sampleRecToCSV(rec));
  }
  function importSavedSample(text){
    try{
      const data=JSON.parse(text);
      let recs=Array.isArray(data)?data:[data];
      recs=recs.filter(r=>r&&Array.isArray(r.items));
      if(!recs.length) return {ok:false,msg:'No valid sample found in that file.'};
      const list=[...savedSamples];
      recs.forEach(r=>{ r.id=makeId(); if(!r.savedAt) r.savedAt=new Date().toISOString();
        if(!r.name) r.name='Imported sample'; list.unshift(r); });
      const ok=persist(list);
      return {ok, count:recs.length, msg: ok?'':'Imported but could not persist to this browser.'};
    }catch(e){ return {ok:false,msg:'That file is not valid JSON.'}; }
  }
  function importSavedSampleCSV(text){
    try{
      const rec=csvToSampleRec(text);
      if(!rec) return {ok:false,msg:'That CSV is not a saved MUS sample.'};
      rec.id=makeId(); rec.savedAt=new Date().toISOString();
      const ok=persist([rec,...savedSamples]);
      return {ok, name:rec.name, rec, msg: ok?'':'Imported but could not persist to this browser.'};
    }catch(e){ return {ok:false,msg:'Could not read that CSV file.'}; }
  }
  function loadEvaluationCSV(text, fname){
    try{
      const rec=csvToEvalRec(text);
      if(!rec) return {ok:false,msg:'That CSV is not a saved MUS evaluation.'};
      const name=(fname||'evaluation').replace(/\.csv$/i,'');
      const selection={ items:rec.items, interval:rec.interval, randomStart:rec.randomStart||0,
        sampleSize:rec.items.length, total:rec.total, popCount:rec.items.length,
        ee:'Low', confidence:rec.confidence, materiality:rec.materiality, sampleBasis:rec.sampleBasis };
      set({ selection, audited:rec.audited||{}, unable:rec.unable||{}, confirmedOver:{}, anomaly:rec.anomaly||{},
        materialityDollar:rec.materialityDollar||'', loadedName:name, step:3, sampleBasis:rec.sampleBasis });
      return {ok:true, name};
    }catch(e){ return {ok:false,msg:'Could not read that evaluation CSV.'}; }
  }

  function defaultSampleName(){ const b=(st.selection&&st.selection.sampleBasis)||st.sampleBasis; return baseName(username,b); }

  const S={...st,set, username, setUsername, defaultSampleName, savedSamples, saveCurrentSample,
    deleteSavedSample, loadSavedSample, exportSavedSample, importSavedSample, importSavedSampleCSV, loadEvaluationCSV};

  // keep sample size synced to the table when planning params change
  useEffect(()=>{ set({sampleSize:SAMPLE_TABLES[st.ee][st.confidence][st.materiality], intervalTouched:false});
  // eslint-disable-next-line
  },[st.ee,st.confidence,st.materiality]);

  const steps=[
    {n:1,t:"Sample size",d:"Confidence · materiality · EE"},
    {n:2,t:"Select sample",d:"Probability-proportional-to-size"},
    {n:3,t:"Evaluate",d:"Project errors to population"},
  ];
  return (
    <>
      <header className="app"><div className="wrap head-row">
        <div>
          <h1>Monetary Unit Sampling <span className="tag">AUDIT TOOL</span></h1>
          <p>All calculations run in your browser — nothing you enter leaves this page.</p>
        </div>
        <div className="who">
          <label htmlFor="who-in">Performed by (used in file names)</label>
          <input id="who-in" type="text" value={username} onChange={e=>setUsername(e.target.value)}
            placeholder="your name / initials"/>
        </div>
      </div></header>
      <div className="wrap">
        <nav className="steps" aria-label="Workflow">
          {steps.map(s=>{
            const done = (s.n===2 && !!st.selection) ||
                         (s.n===3 && !!st.selection && Object.keys(st.audited||{}).length>0);
            return (
              <button key={s.n} className={st.step===s.n?"active":""}
                aria-current={st.step===s.n?"step":undefined} onClick={()=>set({step:s.n})}>
                <span className="num">{s.n}</span>
                <span><span className="st">{s.t}</span><br/><span className="sd">{s.d}</span></span>
                {done && <span className="done" title="completed" aria-hidden="true">✓</span>}
              </button>
            );
          })}
          <button className={"doc"+(st.step===4?" active":"")}
            aria-current={st.step===4?"step":undefined} onClick={()=>set({step:4})}>
            <span className="num">ASA</span>
            <span><span className="st">Documentation</span><br/><span className="sd">Evidencing your work (AuASB)</span></span>
          </button>
        </nav>
        {st.step===1 && <StepSize S={S}/>}
        {st.step===2 && <StepSelect S={S}/>}
        {st.step===3 && <StepEvaluate S={S}/>}
        {st.step===4 && <StepDocs S={S}/>}
        <div className="ftr">
          MUS tool {TOOL_VERSION} · sample-size tables per VAGO DST guidance · reliability factors via the Poisson
          distribution · review outputs with professional judgement.<br/>
          Your work is saved automatically in this browser · <span className="linklike" onClick={resetSession}>Reset session</span>
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
/* Compile the JSX with the CLASSIC runtime (React.createElement) so it runs
   in a normal, non-module browser script. */
(function(){
  try{
    var el=document.getElementById('app-code');
    var out=Babel.transform(el.textContent,{presets:[['react',{runtime:'classic'}]]}).code;
    var s=document.createElement('script'); s.textContent=out; document.body.appendChild(s);
  }catch(e){
    console.error(e);
    document.getElementById('root').innerHTML=
      '<pre style="color:#b3261e;padding:18px;white-space:pre-wrap;font-family:Consolas,monospace">'+
      'The tool failed to start:\n\n'+((e&&e.message)||e)+
      '\n\n(Check your internet connection — the React/Babel libraries load from a CDN.)</pre>';
  }
})();
</script>
</body>
</html>
